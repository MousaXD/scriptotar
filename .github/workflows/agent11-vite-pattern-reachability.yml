name: Agent 11 Vite source-pattern reachability (non-release)

on:
  push:
    branches:
      - agent-11/p0-supply-chain-recovery-20261118
    paths:
      - '.github/workflows/agent11-vite-pattern-reachability.yml'
      - 'apps/desktop-ui/scripts/probe-vite-pattern-reachability.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-vite-source-pattern:
    name: Bounded Vite source-pattern E2E (Ubuntu/Windows) — NOT RELEASE
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify branch source identity and clean install
        run: |
          git rev-parse HEAD
          node --version
          npm ci
          npm ls vite picomatch tinyglobby
      - name: Run bounded source-controlled Vite import.meta.glob experiment
        run: |
          node --check scripts/probe-vite-pattern-reachability.mjs
          node scripts/probe-vite-pattern-reachability.mjs
      - name: Preserve original independent parser exploit evidence
        run: |
          node --check scripts/probe-picomatch-redos.mjs
          node scripts/probe-picomatch-redos.mjs --report --extended
          echo 'Original --assert-patched security workflow is unchanged and remains authoritative.'

name: Agent 2 Rust autofix

on:
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/agent2-rustfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Repair Agent 2 test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ai = Path('crates/scriptotar-ai/src/lib.rs')
          text = ai.read_text()
          text = text.replace('r#\\"{\\"choices\\":[{\\"message\\":{\\"content\\":\\"mock result\\"}}]}\\"#', 'r#"{"choices":[{"message":{"content":"mock result"}}]}"#')
          text = text.replace('r#\\"{\\"error\\":{\\"message\\":\\"bad key session-secret\\"}}\\"#', 'r#"{"error":{"message":"bad key session-secret"}}"#')
          ai.write_text(text)

          research = Path('crates/scriptotar-research/src/lib.rs')
          text = research.read_text()
          text = text.replace("raw.replace(['\\r', '\\n'], \" \")", "raw.replace('\\r', \" \").replace('\\n', \" \")")
          research.write_text(text)
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit fixes to temporary branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo 'No Rust fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.rs' crates apps || true
          git add crates/scriptotar-ai/src/lib.rs crates/scriptotar-research/src/lib.rs
          git commit -am 'style: format Agent 2 Rust changes'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

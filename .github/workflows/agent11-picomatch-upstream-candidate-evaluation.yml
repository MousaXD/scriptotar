# Agent11 exploratory only: NOT a patched npm package, dependency remediation, or release authorization.
# Second-wave source-exact research: compare upstream #264/#258/#266/#269/#270/#273 with
# original strict 19 security cases AND unchanged 4.0.7 positive matcher semantics.
# Previous #275 analyzer's 19/19 security PASS but 2/10 legacy parity FAIL is preserved at SHA 6159019.
name: Agent11 upstream picomatch candidate evaluation (test-only, release veto)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-parser-regression:
    name: Original 19-case and compatibility (${{ matrix.label }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "upstream-pr264", pr: "264", sha: "8144a1a22a8fa1766951411f220cc8c6228cb041", os: "ubuntu-22.04" }
          - { label: "upstream-pr264", pr: "264", sha: "8144a1a22a8fa1766951411f220cc8c6228cb041", os: "windows-2022" }
          - { label: "upstream-pr258", pr: "258", sha: "578a87fae0ffd1f2e5420ff4d52135eb9210d169", os: "ubuntu-22.04" }
          - { label: "upstream-pr258", pr: "258", sha: "578a87fae0ffd1f2e5420ff4d52135eb9210d169", os: "windows-2022" }
          - { label: "upstream-pr266", pr: "266", sha: "cad55d062b063e559913b6b0b368d7bb96c33f42", os: "ubuntu-22.04" }
          - { label: "upstream-pr266", pr: "266", sha: "cad55d062b063e559913b6b0b368d7bb96c33f42", os: "windows-2022" }
          - { label: "upstream-pr269", pr: "269", sha: "0a8fd459730fe42bcddc9cee69a56e19cc5f53de", os: "ubuntu-22.04" }
          - { label: "upstream-pr269", pr: "269", sha: "0a8fd459730fe42bcddc9cee69a56e19cc5f53de", os: "windows-2022" }
          - { label: "upstream-pr270", pr: "270", sha: "614ef37229ceea362ccbc729fb64e98a7e327dc8", os: "ubuntu-22.04" }
          - { label: "upstream-pr270", pr: "270", sha: "614ef37229ceea362ccbc729fb64e98a7e327dc8", os: "windows-2022" }
          - { label: "upstream-pr273", pr: "273", sha: "6e7b1f76acfea1978d9433158bb081310ed4476f", os: "ubuntu-22.04" }
          - { label: "upstream-pr273", pr: "273", sha: "6e7b1f76acfea1978d9433158bb081310ed4476f", os: "windows-2022" }
    steps:
      - name: Checkout exact candidate test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate test source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Checkout immutable reviewed Agent11 guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch immutable original 19-case exploit probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 292e408087d8b48bc012e52d1f3e7ab0c8b89650
          path: .agent11-original-exploit
          sparse-checkout: |
            apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch upstream proposed parser source; never use mutable HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: micromatch/picomatch
          ref: refs/pull/${{ matrix.pr }}/head
          path: .agent11-proposed-upstream
          persist-credentials: false
      - name: Check every immutable input and trusted guard before npm ci
        shell: bash
        env:
          EXPECT_UPSTREAM_SHA: ${{ matrix.sha }}
        run: |
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git -C .agent11-original-exploit rev-parse HEAD)" = "292e408087d8b48bc012e52d1f3e7ab0c8b89650"
          test "$(git -C .agent11-proposed-upstream rev-parse HEAD)" = "$EXPECT_UPSTREAM_SHA"
          node --check .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install real locked vulnerable npm dependency tree (baseline)
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Preserve original npm audit metadata observation
        shell: bash
        working-directory: apps/desktop-ui
        run: npm audit --audit-level=high
      - name: Install immutable original exploit test without changing tracked test or lockfile
        shell: bash
        run: |
          test ! -e apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          cp .agent11-original-exploit/apps/desktop-ui/scripts/probe-picomatch-redos.mjs apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          test "$(node -p "require('./apps/desktop-ui/node_modules/picomatch/package.json').version")" = "4.0.7"
      - name: Baseline original 19-case report (expected RED but keep evidence)
        shell: bash
        working-directory: apps/desktop-ui
        run: node scripts/probe-picomatch-redos.mjs --report --extended
      - name: Verify original published 4.0.7 positive/negative matcher behavior BEFORE candidate
        shell: bash
        run: node tests/defragmentation/security/agent11_picomatch_legacy_semantics.mjs baseline
      - name: Apply source-exact experimental upstream parser files to disposable node_modules only
        shell: bash
        run: |
          cp .agent11-proposed-upstream/lib/parse.js apps/desktop-ui/node_modules/picomatch/lib/parse.js
          if [ "${{ matrix.pr }}" = "269" ]; then
            cp .agent11-proposed-upstream/lib/picomatch.js apps/desktop-ui/node_modules/picomatch/lib/picomatch.js
            node --check apps/desktop-ui/node_modules/picomatch/lib/picomatch.js
          fi
          node --check apps/desktop-ui/node_modules/picomatch/lib/parse.js
          git diff --exit-code -- apps/desktop-ui/package.json apps/desktop-ui/package-lock.json
          echo "EXPERIMENTAL NODE_MODULES MUTATION ONLY; NOT A PUBLISHED PATCHED PACKAGE"
      - name: Preserve BOTH independent security and matching contracts as mandatory failures
        shell: bash
        run: |
          # Neither failure is a warning. Capture both independent verdicts
          # before the aggregate hard failure (no job-level continue-on-error).
          set +e
          node tests/defragmentation/security/agent11_picomatch_legacy_semantics.mjs candidate
          matcher_exit=$?
          (cd apps/desktop-ui && node scripts/probe-picomatch-redos.mjs --assert-patched --extended)
          security_exit=$?
          set -e
          echo "Strict matcher behavior exit: $matcher_exit"
          echo "Immutable 19-case security exit: $security_exit"
          if [ "$matcher_exit" -ne 0 ] || [ "$security_exit" -ne 0 ]; then
            echo "NO-GO: candidate must pass BOTH unchanged contracts"
            exit 1
          fi
      - name: Record generated regex source for challenging bounded examples
        shell: bash
        run: |
          node <<'NODE'
          const pm = require('./apps/desktop-ui/node_modules/picomatch');
          const examples = ['+([ab]|b)', '+(@(+([ab])))', '+(a|b|ab)', '+(*)c', '*(a*|b)', '*(!(foo))'];
          for (const pattern of examples) {
            try { console.log(JSON.stringify({pattern, source: pm.makeRe(pattern).source})); }
            catch (error) { console.log(JSON.stringify({pattern, error: error.message})); }
          }
          NODE
      - name: Check Svelte and TS compatibility if and only if original 19-case is green
        shell: bash
        working-directory: apps/desktop-ui
        run: npm run check
      - name: Run complete frontend unit tests if and only if original 19-case is green
        shell: bash
        working-directory: apps/desktop-ui
        run: npm test
      - name: Run genuine Vite production build if and only if original 19-case is green
        shell: bash
        working-directory: apps/desktop-ui
        run: npm run build

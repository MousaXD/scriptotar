name: Rust foundation

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'docs/architecture/**'
      - '.github/workflows/rust-foundation.yml'
  push:
    branches: [main, feature/technical-futures]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop-ui/**'
      - 'scripts/apply_technical_futures_phase2.py'
      - '.github/workflows/rust-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-technical-futures-phase-two:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/technical-futures'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout working branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/technical-futures
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - name: Apply phase two patch
        run: python3 scripts/apply_technical_futures_phase2.py
      - name: Format Rust workspace
        run: cargo +1.97.1 fmt --all
      - name: Validate desktop UI
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Validate Rust changes
        run: |
          cargo check --workspace --all-targets --locked
          cargo test -p scriptotar-db -p scriptotar-orchestrator --locked
      - name: Restore normal CI and commit phase two
        shell: bash
        run: |
          set -euo pipefail
          git show 071dfc0f90fc300b760b0c85d28f26c7bc20e932:.github/workflows/rust-foundation.yml > .github/workflows/rust-foundation.yml
          rm scripts/apply_technical_futures_phase2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add safe lineage backfill and job events"
          git push origin HEAD:feature/technical-futures

  rust:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked

name: Rust foundation

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'docs/architecture/**'
      - '.github/workflows/rust-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'docs/architecture/**'
      - '.github/workflows/rust-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Simplify completed-migration startup branch
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/lib.rs')
          text = path.read_text()
          needle = '            let preparation = if let Some(status) = completed_status_if_marked(&data_dir) {'
          replacement = (
              ' ' * 12 + 'let preparation = if completed_status_if_marked(&data_dir).is_some() {\n'
              + ' ' * 16 + 'None\n'
              + ' ' * 12 + '} else {\n'
              + ' ' * 16 + 'Some(migration::prepare_startup(&data_dir))\n'
              + ' ' * 12 + '};\n'
          )
          if needle in text:
              start = text.index(needle)
              end = text.index('            let operational_store = ', start)
              path.write_text(text[:start] + replacement + text[end:])
          elif replacement.strip() not in text:
              raise SystemExit('expected startup branch was not found')
      - name: Apply Rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: apply rustfmt after operational hardening"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked

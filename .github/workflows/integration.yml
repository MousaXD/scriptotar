name: Tauri migration integration

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - '.github/workflows/integration.yml'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
      - 'rewrite/tauri-integration'
      - 'improve/scriptotar-next-integration'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - '.github/workflows/integration.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - name: Build frontend assets required by Tauri context
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
          npm run build
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked

  frontend:
    name: Svelte frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Install
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
      - name: Check
        working-directory: apps/desktop-ui
        run: npm run check
      - name: Test
        working-directory: apps/desktop-ui
        run: npm run test
      - name: Build
        working-directory: apps/desktop-ui
        run: npm run build

  sidecar:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/transcription/requirements-engine.txt
      - name: Syntax
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m compileall -q .
      - name: Unit and protocol subprocess tests
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Install real engine dependencies
        run: python -m pip install -r sidecars/transcription/requirements-engine.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify engine imports without downloading a model
        run: |
          python - <<'PY'
          import faster_whisper
          import yt_dlp
          print("faster-whisper", faster_whisper.__version__)
          print("yt-dlp", yt_dlp.version.__version__)
          PY

  integration:
    name: Rust ↔ sidecar integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Headless local fixture flows
        run: cargo test --locked -p scriptotar-orchestrator -- --nocapture
      - name: Database migration and recovery flows
        run: cargo test --locked -p scriptotar-db integration -- --nocapture

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - name: Rust advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm advisories
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
          npm audit --audit-level=high
      - name: Python advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r sidecars/transcription/requirements-engine.txt

  tauri-build:
    name: Integrated Tauri build
    needs: [rust, frontend, sidecar, integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '2.11.2' --locked
      - name: Compile integrated desktop app
        working-directory: apps/desktop
        run: cargo tauri build --no-bundle -- --locked

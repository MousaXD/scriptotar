name: Tauri migration integration

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - '.github/workflows/integration.yml'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
      - 'rewrite/tauri-integration'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - '.github/workflows/integration.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - name: Build frontend assets required by Tauri context
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
          npm run build
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  frontend:
    name: Svelte frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Install
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
      - name: Check
        working-directory: apps/desktop-ui
        run: npm run check
      - name: Test
        working-directory: apps/desktop-ui
        run: npm run test
      - name: Build
        working-directory: apps/desktop-ui
        run: npm run build

  sidecar:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/transcription/requirements-engine.txt
      - name: Syntax
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m compileall -q .
      - name: Unit and protocol subprocess tests
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Install real engine dependencies
        run: python -m pip install -r sidecars/transcription/requirements-engine.txt
      - name: Verify engine imports without downloading a model
        run: |
          python - <<'PY'
          import faster_whisper
          import yt_dlp
          print("faster-whisper", faster_whisper.__version__)
          print("yt-dlp", yt_dlp.version.__version__)
          PY

  integration:
    name: Rust ↔ sidecar integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Headless local fixture flows
        run: cargo test -p scriptotar-orchestrator -- --nocapture
      - name: Database migration and recovery flows
        run: cargo test -p scriptotar-db integration -- --nocapture

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm advisories
        working-directory: apps/desktop-ui
        run: |
          test -f package-lock.json
          npm ci
          npm audit --audit-level=high
      - name: Python advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r sidecars/transcription/requirements-engine.txt

  tauri-build:
    name: Integrated Tauri build
    needs: [rust, frontend, sidecar, integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '2.11.2' --locked
      - name: Compile integrated desktop app
        working-directory: apps/desktop
        run: cargo tauri build --no-bundle

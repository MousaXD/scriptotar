      - name: Reproduce unpatched, official parser byte provenance
        run: |
          npm ci
          node -e "if(require('picomatch/package.json').version!=='4.0.7') process.exit(1)"
          test "$(git hash-object node_modules/picomatch/lib/parse.js)" = 29207512c60183b4bb9bf5112be3b9b5f4a9a9fd
      - name: Apply experimental upstream PR259 source to ephemeral node_modules only
        run: |
          git show HEAD:apps/desktop-ui/scripts/experimental/picomatch-4.0.7-pr259.patch > scripts/experimental/.ci-pr259-lf.patch
          test "$(git hash-object scripts/experimental/.ci-pr259-lf.patch)" = 8d12d987655d3b7298c64e4bb27899a8291d6097
          git apply --check -p1 --directory=apps/desktop-ui/node_modules/picomatch scripts/experimental/.ci-pr259-lf.patch
          git apply -p1 --directory=apps/desktop-ui/node_modules/picomatch scripts/experimental/.ci-pr259-lf.patch
          test "$(git hash-object node_modules/picomatch/lib/parse.js)" != 29207512c60183b4bb9bf5112be3b9b5f4a9a9fd
      - name: Extended bounded exploit regression must be clean
        run: node scripts/probe-picomatch-redos.mjs --assert-patched --extended
      - name: Broad experimental application compatibility
        run: |
          npm run check
          npm run test
          npm run build
      - name: Preserve original strict audit failure and release veto
        run: |
          echo 'Unreleased unreviewed upstream comparison only; npm package-lock unchanged.'
          echo 'Mandatory strict npm audit remains a known fail; release NO-GO.'

  upstream-pr260-experiment:

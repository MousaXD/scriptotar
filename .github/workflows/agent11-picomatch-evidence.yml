  upstream-pr264-experiment:
    # A genuinely open upstream parser proposal, applied only in ephemeral CI node_modules.
    # This is NOT a lockfile change, supported distribution or audit remediation.
    name: Active upstream PR264 parser trial (${{ matrix.os }}) — NOT RELEASE

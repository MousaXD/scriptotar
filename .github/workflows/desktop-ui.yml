name: Desktop UI

on:
  pull_request:
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  push:
    branches:
      - main
      - 'rewrite/svelte-desktop-ui'
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact unmerged source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Checkout immutable reviewed Agent11 pre-Vite gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 5cf011caa61ae06595151893ea41561c0fcfeb6d
          path: .agent11-trusted-guard
          persist-credentials: false
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
      - name: Validate pinned prebuild guard and audited PR source before npm/Vite
        working-directory: .
        run: |
          node -e "if(require('child_process').execFileSync('git',['-C','.agent11-trusted-guard','rev-parse','HEAD'],{encoding:'utf8'}).trim()!=='5cf011caa61ae06595151893ea41561c0fcfeb6d')process.exit(1)"
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install dependencies
        run: |
          test -f package-lock.json
          npm ci
      - name: Type and Svelte checks
        run: npm run check
      - name: Interaction tests
        run: npm run test
      - name: Production build
        run: npm run build

name: Desktop UI

on:
  pull_request:
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  push:
    branches:
      - 'rewrite/svelte-desktop-ui'
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency lock for migration branch
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit dependency lock on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/svelte-desktop-ui'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(ui): lock frontend dependencies'
          git push origin HEAD:rewrite/svelte-desktop-ui
      - name: Install dependencies
        run: npm ci
      - name: Type and Svelte checks
        run: npm run check
      - name: Interaction tests
        run: npm run test
      - name: Production build
        run: npm run build

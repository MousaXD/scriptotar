name: Desktop UI

on:
  pull_request:
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  push:
    branches:
      - main
      - 'rewrite/svelte-desktop-ui'
    paths:
      - 'apps/desktop-ui/**'
      - '.github/workflows/desktop-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Install dependencies
        run: |
          test -f package-lock.json
          npm ci
      - name: Type and Svelte checks
        run: npm run check
      - name: Interaction tests
        run: npm run test
      - name: Production build
        run: npm run build

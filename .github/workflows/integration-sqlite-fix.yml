name: Temporary integration SQLite dependency fix

on:
  push:
    branches:
      - improve/scriptotar-next-integration

permissions:
  contents: write

concurrency:
  group: scriptotar-integration-sqlite-fix
  cancel-in-progress: true

jobs:
  fix-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out authoritative integration head
        uses: actions/checkout@v4
        with:
          ref: improve/scriptotar-next-integration
          fetch-depth: 0

      - name: Restore direct SQLite dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/Cargo.toml")
          text = path.read_text()
          old = 'scriptotar-research = { path = "../../../crates/scriptotar-research" }\nserde.workspace = true'
          new = 'scriptotar-research = { path = "../../../crates/scriptotar-research" }\nrusqlite.workspace = true\nserde.workspace = true'
          if text.count(old) != 1:
              raise SystemExit("expected one desktop dependency insertion point")
          path.write_text(text.replace(old, new, 1))

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate and verify lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --check

      - name: Commit dependency repair
        shell: bash
        run: |
          git config user.name "scriptotar-ci-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.toml Cargo.lock
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: restore desktop SQLite dependency"
          git push origin HEAD:improve/scriptotar-next-integration

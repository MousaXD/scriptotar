# Reference implementation only, authored by Agent10. Not independent QA approval.
name: Proposed bounded native PNG decoder source tests (not installed QA)
on:
  push:
    branches: [agent-10/proposed-native-png-safe-inflate-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    name: Original visual evidence decoder unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout exact test and proposed source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require original commit and no modified source
        shell: bash
        env:
          PROPOSAL_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PROPOSAL_SHA"
          git diff --quiet HEAD -- tests/defragmentation/native-e2e/visual_observations.py tests/defragmentation/native-e2e/test_visual_observations.py
      - name: Pin Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run existing RGB/RGBA/CRC and new capped zlib tests (synthetic ONLY)
        shell: bash
        run: python -m unittest discover -s tests/defragmentation/native-e2e -p test_visual_observations.py -v

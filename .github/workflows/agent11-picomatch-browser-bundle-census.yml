# Agent11 supply-chain EVIDENCE ONLY — not a picomatch fix or release gate approval.
# Proves (or rejects) browser-bundle module exposure at an exact immutable source
# and lockfile; build-time Vite parser remains separately vulnerable.
name: Agent11 exact-source browser-bundle transitive matcher census (not remediation)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-picomatch-browser-bundle-census.yml'
      - 'tests/defragmentation/security/agent11_bundle_module_census.mjs'
      - 'tests/defragmentation/security/agent11_desktop_npm_scope_attestation.mjs'
      - 'apps/desktop-ui/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actual-browser-bundle:
    name: Actual frontend bundle graph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout exact experimental source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set Node 22 for source-exact frontend build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout reviewed immutable source guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify worktree/source/guard pins and scan before npm install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git hash-object apps/desktop-ui/package-lock.json)" = "eebc9228dd404f0b9f9bd55f2665ab3e00fe9dfa"
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Attest original development-only picomatch dependency boundary before npm
        shell: bash
        run: |
          node --check tests/defragmentation/security/agent11_desktop_npm_scope_attestation.mjs
          node tests/defragmentation/security/agent11_desktop_npm_scope_attestation.mjs
      - name: Install original locked Vite toolchain (no experimental source patch)
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Inspect REAL production output Rollup module graph
        shell: bash
        run: node tests/defragmentation/security/agent11_bundle_module_census.mjs
      - name: Assert historical lock and manifest were not rewritten
        shell: bash
        run: git diff --exit-code -- apps/desktop-ui/package.json apps/desktop-ui/package-lock.json

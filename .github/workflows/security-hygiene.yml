name: Security hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - 'improve/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 branch, immutable security-backport head
      - name: Verify GitHub Actions use immutable pins
        run: |
          python3 scripts/check_github_action_pins.py --self-test
          python3 scripts/check_github_action_pins.py
      - name: Scan tracked repository content
        run: python3 scripts/check_repo_hygiene.py

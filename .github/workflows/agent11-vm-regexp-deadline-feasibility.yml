# Agent11 feasibility: Node vm.Script synchronous deadlines for original
# picomatch@4.0.7 generated lookahead regexes. NOT parser remediation.
name: Agent11 VM RegExp deadline feasibility (research only, NO-GO)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-vm-regexp-deadline-feasibility.yml'
      - 'tests/defragmentation/security/agent11_vm_regexp_deadline_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-timeout-original-regexp:
    name: Original locked 4.0.7 — exact captured results and bounded hostile VM
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact research source without token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set original Node22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout reviewed immutable first-party guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify pins and trusted source BEFORE npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git hash-object apps/desktop-ui/package-lock.json)" = "eebc9228dd404f0b9f9bd55f2665ab3e00fe9dfa"
          node --check tests/defragmentation/security/agent11_vm_regexp_deadline_probe.mjs
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install original npm lock, no source changes, no package overrides
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Demonstrate synchronous VM RegExp deadlines on original locked regexes
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s node tests/defragmentation/security/agent11_vm_regexp_deadline_probe.mjs
          git diff --exit-code -- apps/desktop-ui/package-lock.json apps/desktop-ui/package.json
          echo 'VM RegExp execution deadline research only — not full parser or makeRe safety'

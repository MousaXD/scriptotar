name: Bootstrap Scriptotar 1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-scriptotar-1.2.yml'
      - '.scriptotar-bootstrap/source.b64'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with Scriptotar 1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base64 -d .scriptotar-bootstrap/source.b64 > "$work/source.zip"
          unzip -q "$work/source.zip" -d "$work/extracted"
          test -f "$work/extracted/scriptotar-1.2.0/scriptotar.py"
          test -f "$work/extracted/scriptotar-1.2.0/creator.py"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work/extracted/scriptotar-1.2.0/." .

          python3 -m py_compile scriptotar.py worker.py core.py creator.py
          PYTHONPATH=. python3 -m unittest discover -s tests -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release Scriptotar 1.2.0"
          git push origin HEAD:main

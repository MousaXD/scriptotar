# Agent11: source-exact real Vite hostile escaped import.meta.glob comparison.
# Baseline deliberately reproduces source-pattern risk in an isolated job;
# test-only VM preload MUST fail closed fast or is rejected, no release gate.
name: Agent11 real Vite hostile glob VM interception (experimental NO-GO)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-vm-actual-hostile-vite-route.yml'
      - 'tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_preload.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-vite-compiler-exposure:
    name: Real Vite escaped source import + hostile glob with/without VM hook
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout source exact SHA with no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22 original frontend runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout immutable original trusted source guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Preflight immutable lock, source guard and bounded fixture script before npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git hash-object apps/desktop-ui/package-lock.json)" = "eebc9228dd404f0b9f9bd55f2665ab3e00fe9dfa"
          node --check tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs
          node --check tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs
          node --check tests/defragmentation/security/agent11_vm_regex_wrapper_preload.cjs
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install official original npm lock without parser overrides
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Compare actual Vite bounded baseline and test-only guard with isolated temporary source
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s node tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs
          git diff --exit-code -- apps/desktop-ui/package-lock.json apps/desktop-ui/package.json apps/desktop-ui/src/main.ts
          echo 'Research-only! Actual trusted source guard must remain; no production parser/remediation change.'

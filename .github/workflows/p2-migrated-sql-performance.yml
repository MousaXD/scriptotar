name: P2 Migrated SQLite Performance Smoke (not native certification)

on:
  pull_request:
    branches:
      - integration/scriptotar-defragmentation-agent00-20261113
    paths:
      - "tests/defragmentation/benchmarks/**"
      - "crates/scriptotar-db/examples/make_blank_perf_template.rs"
      - ".github/workflows/p2-migrated-sql-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-migrated-sql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-and-synthetic-queries:
    name: Real migrations + synthetic SQL / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit, not PR merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source SHA
        run: |
          python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['EXACT_SHA']"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Hermetic unit checks (migration stub, not native)
        run: python -m unittest tests.defragmentation.benchmarks.test_performance_suite -v
      - name: Create isolated scratch marker
        run: |
          python -c "import os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'scriptotar-perf-sql'; p.mkdir(exist_ok=False); (p/'.scriptotar-benchmark-only').write_text('SYNTHETIC_ONLY\n',encoding='utf-8')"
      - name: Run actual Rust migrations + 100/1k/10k synthetic SQL
        run: |
          python -m tests.defragmentation.benchmarks.run_migrated_scale --out-dir "${{ runner.temp }}/scriptotar-perf-sql" --source-sha "${{ env.EXACT_SHA }}" --sizes 100 1000 10000 --iterations 11
      - name: Verify packaged-app SQLite layout in disposable scratch only (not native)
        env:
          PERF_ROOT: ${{ runner.temp }}/scriptotar-perf-sql
        run: |
          python -c "import os; from pathlib import Path; root=Path(os.environ['PERF_ROOT']); [(root / ('app-' + str(n))).mkdir() for n in (100,1000,10000)]; [(root / ('app-' + str(n)) / '.scriptotar-benchmark-only').write_text('SYNTHETIC_ONLY\n',encoding='utf-8') for n in (100,1000,10000)]"
          python -m tests.defragmentation.benchmarks.stage_installed_fixture --fixture "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-100.sqlite3" --manifest "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-100.json" --data-dir "${{ runner.temp }}/scriptotar-perf-sql/app-100" --study-count 100 --source-sha "${{ env.EXACT_SHA }}" --output "${{ runner.temp }}/scriptotar-perf-sql/app-100/staging-proof.json"
          python -m tests.defragmentation.benchmarks.stage_installed_fixture --fixture "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-1000.sqlite3" --manifest "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-1000.json" --data-dir "${{ runner.temp }}/scriptotar-perf-sql/app-1000" --study-count 1000 --source-sha "${{ env.EXACT_SHA }}" --output "${{ runner.temp }}/scriptotar-perf-sql/app-1000/staging-proof.json"
          python -m tests.defragmentation.benchmarks.stage_installed_fixture --fixture "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-10000.sqlite3" --manifest "${{ runner.temp }}/scriptotar-perf-sql/scriptotar-synthetic-10000.json" --data-dir "${{ runner.temp }}/scriptotar-perf-sql/app-10000" --study-count 10000 --source-sha "${{ env.EXACT_SHA }}" --output "${{ runner.temp }}/scriptotar-perf-sql/app-10000/staging-proof.json"
      - name: Upload SQL-only evidence, never brand as native
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-migrated-synthetic-sql-${{ matrix.os }}-${{ env.EXACT_SHA }}
          path: |
            ${{ runner.temp }}/scriptotar-perf-sql/*.json
            ${{ runner.temp }}/scriptotar-perf-sql/app-*/*.json
          if-no-files-found: warn
          retention-days: 14

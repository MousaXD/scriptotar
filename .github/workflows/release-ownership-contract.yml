name: Release Ownership Contract

on:
  pull_request:
    paths:
      - '.github/workflows/windows-tauri.yml'
      - '.github/workflows/linux-tauri.yml'
      - '.github/workflows/tauri-next-release.yml'
      - '.github/workflows/release-ownership-contract.yml'
      - '.github/scripts/validate_release_ownership.py'
      - 'sidecars/transcription/RELEASE-PUBLISHING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-ownership:
    name: Validate single release publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Validate packaging and release ownership contracts
        run: python .github/scripts/validate_release_ownership.py

# Experimental VM wrapper still fails to control native RegExp prototype call or
# public picomatch.test with user-supplied plain native RegExp. NOT REPAIR.
name: Agent11 VM guard direct-native bypass negative tests (NO-GO)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-vm-direct-native-bypass-certification.yml'
      - 'tests/defragmentation/security/agent11_vm_direct_native_bypass_eval.mjs'
      - 'tests/defragmentation/security/agent11_vm_compile_guard_candidate.cjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs'
  workflow_dispatch:

permissions:

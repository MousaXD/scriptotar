name: Temporary integration Clippy cleanup

on:
  push:
    branches:
      - improve/scriptotar-next-integration

permissions:
  contents: write

concurrency:
  group: scriptotar-integration-clippy-fix
  cancel-in-progress: true

jobs:
  fix-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out authoritative integration head
        uses: actions/checkout@v4
        with:
          ref: improve/scriptotar-next-integration
          fetch-depth: 0

      - name: Remove integrated dead code cleanly
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/src/services.rs")
          text = path.read_text()

          old = '''struct WatchlistRefresher {\n    inner: Arc<WatchlistRefresherInner>,\n}'''
          new = '''struct WatchlistRefresher {\n    _inner: Arc<WatchlistRefresherInner>,\n}'''
          if text.count(old) != 1:
              raise SystemExit("expected one WatchlistRefresher field")
          text = text.replace(old, new, 1)

          old = '''    pub fn refresh_watchlists(&self) -> Result<usize, String> {\n        let active_project = self\n            .active_project_id()\n            .map_err(|error| error.to_string())?;\n        let watchlists = self\n            .store\n            .list_watchlists(Some(active_project))\n            .map_err(|error| error.to_string())?;\n        let settings = self\n            .store\n            .load_settings()\n            .map_err(|error| error.to_string())?;\n        let mut saved_items = 0_usize;\n        let mut errors = Vec::new();\n        for watchlist in watchlists {\n            match scan_and_persist_research(\n                &self.store,\n                &self.research_command,\n                watchlist.project_id,\n                &watchlist.profile_url,\n                watchlist.limit_count.min(200) as u16,\n                settings.cookie_browser.as_deref(),\n            ) {\n                Ok(count) => saved_items += count,\n                Err(error) => errors.push(format!("{}: {error}", watchlist.label)),\n            }\n        }\n        if errors.is_empty() {\n            Ok(saved_items)\n        } else {\n            Err(format!(\n                "some watchlists could not be refreshed: {}",\n                errors.join("; ")\n            ))\n        }\n    }\n\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one unused manual refresh method")
          text = text.replace(old, "", 1)

          old = '''    WatchlistRefresher {\n        inner: Arc::new(WatchlistRefresherInner {'''
          new = '''    WatchlistRefresher {\n        _inner: Arc::new(WatchlistRefresherInner {'''
          if text.count(old) != 1:
              raise SystemExit("expected one WatchlistRefresher constructor")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and verify diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit Clippy cleanup
        shell: bash
        run: |
          git config user.name "scriptotar-ci-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/services.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "refactor: clean watchlist refresher ownership"
          git push origin HEAD:improve/scriptotar-next-integration

name: Temporary integration maintenance

on:
  push:
    branches:
      - improve/scriptotar-next-integration

permissions:
  contents: write

concurrency:
  group: scriptotar-integration-maintenance
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out integration head
        uses: actions/checkout@v4
        with:
          ref: improve/scriptotar-next-integration
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Reconcile Cargo.lock with workspace manifests
        run: |
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Verify mechanical diff
        run: git diff --check

      - name: Commit mechanical normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "scriptotar-ci-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          while IFS= read -r -d '' file; do git add -- "$file"; done < <(find . -name '*.rs' -type f -print0)
          git diff --cached --check
          git commit -m "chore: normalize integration formatting and lockfile"
          git push origin HEAD:improve/scriptotar-next-integration

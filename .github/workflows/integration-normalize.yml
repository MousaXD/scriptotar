name: Integration normalize

on:
  push:
    branches:
      - rewrite/tauri-integration

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration source normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/scriptotar-orchestrator/src/lib.rs')
          source = path.read_text()
          needle = 'match job.input {'
          count = source.count(needle)
          if count != 2:
              raise SystemExit(f'expected exactly 2 borrowed JobInput fixes, found {count}')
          path.write_text(source.replace(needle, 'match &job.input {'))
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Generate deterministic frontend lockfile
        working-directory: apps/desktop-ui
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates apps/desktop apps/desktop-ui/package-lock.json
          git commit -m "fix(integration): repair Rust ownership errors"
          git push origin HEAD:rewrite/tauri-integration

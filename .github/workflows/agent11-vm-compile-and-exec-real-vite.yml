# Agent11 opt-in Node compile+exec VM preloader. Not a parser patch.
# 80ms regex execution, 160ms bounded compilation per API call.
name: Agent11 actual hostile Vite with compiler and executor VM deadlines (NO-GO)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-vm-compile-and-exec-real-vite.yml'
      - 'tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs'
      - 'tests/defragmentation/security/agent11_vm_compile_guard_candidate.cjs'
      - 'tests/defragmentation/security/agent11_vm_compile_guard_preload.cjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-4-0-7-actual-vite:
    name: Real source exact Vite benign and hostile globs, combined VM guard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - name: Checkout pinned experimental research SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use original Node22 build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout original trusted source guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Source-reviewed guard and exact pinned npm lock BEFORE dependency installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git hash-object apps/desktop-ui/package-lock.json)" = "eebc9228dd404f0b9f9bd55f2665ab3e00fe9dfa"
          node --check tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs
          node --check tests/defragmentation/security/agent11_vm_compile_guard_candidate.cjs
          node --check tests/defragmentation/security/agent11_vm_compile_guard_preload.cjs
          node --check tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install exact original official picomatch dependency graph, no package override
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Reproduce benign and hostile real Vite with combined time-boxed compiler/exec test hook
        shell: bash
        env:
          AGENT11_VM_PRELOAD_VARIANT: compiler-exec
        run: |
          set -euo pipefail
          node tests/defragmentation/security/agent11_vm_real_vite_hostile_eval.mjs
          git diff --exit-code -- apps/desktop-ui/package.json apps/desktop-ui/package-lock.json apps/desktop-ui/src/main.ts
          echo 'Combined compiler/exec VM only experimental, not full parser or published dependency remediation'

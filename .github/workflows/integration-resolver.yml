name: Temporary Integration Resolver

on:
  push:
    branches: [integration/agent-remediation-final]
    paths:
      - '.github/workflows/integration-resolver.yml'

permissions:
  contents: write

jobs:
  resolve-agent7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Agent 7 E2E deltas over integrated code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          lib = 'apps/desktop/src-tauri/src/lib.rs'
          replace_once(
              lib,
              'mod services;\n\nuse std::{',
              'mod services;\n\n#[cfg(test)]\nmod installed_app_e2e;\n\nuse std::{',
          )
          smoke = '''#[doc(hidden)]
          pub fn run_installed_backend_smoke() -> Result<(), String> {
              let data_dir = env::var_os("SCRIPTOTAR_DATA_DIR")
                  .map(PathBuf::from)
                  .ok_or_else(|| "SCRIPTOTAR_DATA_DIR is required for installed backend smoke".to_owned())?;

              if completed_status_if_marked(&data_dir).is_none() {
                  let _ = migration::prepare_startup(&data_dir);
              }

              let store = SqliteStore::open(data_dir.join("scriptotar.sqlite3")).map_err(command_error)?;
              store.run_integration_migrations().map_err(command_error)?;
              store
                  .recover_interrupted_watchlist_refreshes()
                  .map_err(command_error)?;

              let services = AppServices::new(&data_dir).map_err(command_error)?;
              services.schema_version().map_err(command_error)?;
              services.bootstrap().map_err(command_error)?;
              Ok(())
          }

          '''
          replace_once(
              lib,
              '#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {',
              smoke + '#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {',
          )

          linux = '.github/workflows/linux-tauri.yml'
          replace_once(
              linux,
              '''            libssl-dev \\
            patchelf
''',
              '''            libssl-dev \\
            patchelf \\
            xauth \\
            xvfb
''',
          )
          replace_once(
              linux,
              '''      - name: Build frontend assets
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Build locked Linux deb
''',
              '''      - name: Build frontend assets
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Verify frontend Tauri command contract
        working-directory: apps/desktop-ui
        run: npm test -- src/api/tauriClient.test.ts
      - name: Build locked Linux deb
''',
          )
          replace_once(
              linux,
              '''          RUNTIME_DIR="$(dirname "$RUNTIME_MARKER")"
          python sidecars/transcription/validate_runtime.py "$RUNTIME_DIR"
          python sidecars/transcription/compliance_finalize.py --validate "$RUNTIME_DIR"
      - name: Remove installed preview package
''',
              '''          RUNTIME_DIR="$(dirname "$RUNTIME_MARKER")"
          python sidecars/transcription/validate_runtime.py "$RUNTIME_DIR"
          python sidecars/transcription/compliance_finalize.py --validate "$RUNTIME_DIR"
          APP_BIN="$(dpkg -L "$PACKAGE_NAME" | grep '^/usr/bin/' | head -n 1 || true)"
          test -n "$APP_BIN"
          test -x "$APP_BIN"
          printf 'SCRIPTOTAR_E2E_RUNTIME_DIR=%s\\n' "$RUNTIME_DIR" >> "$GITHUB_ENV"
          printf 'SCRIPTOTAR_INSTALLED_BIN=%s\\n' "$APP_BIN" >> "$GITHUB_ENV"
      - name: Launch installed Scriptotar Next shell
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/scriptotar-installed-launch"
          SCRIPTOTAR_DATA_DIR="$RUNNER_TEMP/scriptotar-installed-launch" \\
            timeout --signal=TERM 8s xvfb-run -a "$SCRIPTOTAR_INSTALLED_BIN" \\
            > dist/INSTALLED-LAUNCH.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat dist/INSTALLED-LAUNCH.log
            echo "Installed Scriptotar process exited unexpectedly with status $STATUS" >&2
            exit 1
          fi
          if grep -Eqi 'panicked at|failed to run Scriptotar desktop shell' dist/INSTALLED-LAUNCH.log; then
            cat dist/INSTALLED-LAUNCH.log
            echo 'Installed Scriptotar shell reported a fatal startup error.' >&2
            exit 1
          fi
      - name: Run installed-app IPC and persistence E2E repeatedly
        run: |
          set -euo pipefail
          test -d "$SCRIPTOTAR_E2E_RUNTIME_DIR"
          for attempt in 1 2 3; do
            echo "Installed-app E2E attempt $attempt/3"
            cargo test -p scriptotar-desktop --lib \\
              installed_app_e2e::installed_app_e2e_round_trip_survives_restart \\
              -- --ignored --exact --nocapture
          done
      - name: Remove installed preview package
''',
          )
          replace_once(
              linux,
              '''            dist/SHA256SUMS.txt
            dist/DEB-CONTENTS.txt
          if-no-files-found: error
''',
              '''            dist/SHA256SUMS.txt
            dist/DEB-CONTENTS.txt
            dist/INSTALLED-LAUNCH.log
          if-no-files-found: error
''',
          )

          windows = '.github/workflows/windows-tauri.yml'
          old = '''          $env:SCRIPTOTAR_DATA_DIR = $dataDir
          $appProcess = Start-Process -FilePath $app.FullName -PassThru
          $database = Join-Path $dataDir 'scriptotar.sqlite3'
          $created = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ($appProcess.HasExited) {
              throw "Installed Scriptotar application exited during startup with code $($appProcess.ExitCode)"
            }
            if (Test-Path $database) {
              $created = $true
              break
            }
          }
          if (-not $created) {
            throw "Installed Scriptotar application did not initialize its data directory: $dataDir"
          }
          Stop-Process -Id $appProcess.Id -Force
'''
          new = '''          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $guiInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $guiInfo.FileName = $app.FullName
          $guiInfo.UseShellExecute = $false
          $guiInfo.Environment['SCRIPTOTAR_DATA_DIR'] = $dataDir
          $guiProcess = [System.Diagnostics.Process]::new()
          $guiProcess.StartInfo = $guiInfo
          if (-not $guiProcess.Start()) {
            throw 'Installed Scriptotar GUI process could not be started.'
          }
          try {
            Start-Sleep -Seconds 5
            if ($guiProcess.HasExited) {
              throw "Installed Scriptotar GUI exited during startup with code $($guiProcess.ExitCode)"
            }
          }
          finally {
            if (-not $guiProcess.HasExited) {
              Stop-Process -Id $guiProcess.Id -Force
              $guiProcess.WaitForExit()
            }
            $guiProcess.Dispose()
          }

          Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $probeInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $probeInfo.FileName = $app.FullName
          $probeInfo.UseShellExecute = $false
          $probeInfo.Environment['SCRIPTOTAR_DATA_DIR'] = $dataDir
          $probeInfo.ArgumentList.Add('--scriptotar-installed-backend-smoke')
          $probe = [System.Diagnostics.Process]::new()
          $probe.StartInfo = $probeInfo
          if (-not $probe.Start()) {
            throw 'Installed Scriptotar backend smoke process could not be started.'
          }
          try {
            if (-not $probe.WaitForExit(20000)) {
              throw 'Installed Scriptotar backend smoke timed out.'
            }
            if ($probe.ExitCode -ne 0) {
              throw "Installed Scriptotar backend smoke exited with code $($probe.ExitCode)"
            }
          }
          finally {
            if (-not $probe.HasExited) {
              Stop-Process -Id $probe.Id -Force
              $probe.WaitForExit()
            }
            $probe.Dispose()
          }

          $database = Join-Path $dataDir 'scriptotar.sqlite3'
          if (-not (Test-Path $database)) {
            throw "Installed Scriptotar backend smoke did not initialize SQLite: $database"
          }
'''
          replace_once(windows, old, new)

          Path('.github/workflows/integration-resolver.yml').unlink()
          PY
      - name: Commit resolved integration
        run: |
          git config user.name 'Scriptotar Integration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: finish installed-app E2E integration'
          git push origin HEAD:integration/agent-remediation-final

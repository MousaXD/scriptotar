name: Scriptotar Next Preview Release

on:
  workflow_run:
    workflows:
      - Windows Tauri Installer
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/tauri-next-release.yml'
      - '.github/workflows/integration.yml'
      - '.github/workflows/security-hygiene.yml'
      - '.github/workflows/windows-tauri.yml'
      - '.github/workflows/linux-tauri.yml'
      - 'scripts/release_ci_gate.py'
      - 'scripts/tests/test_release_ci_gate.py'
      - '.github/scripts/assert-tauri-next-current-main.sh'
      - '.github/tests/test_tauri_next_release_race.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: tauri-next-release-publisher
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 branch, immutable security-backport head
      - name: Test exact-SHA release gate logic
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_ci_gate.py' -v
      - name: Verify package workflow contracts
        run: |
          set -euo pipefail
          grep -F 'name: Build and smoke-test NSIS setup.exe' .github/workflows/windows-tauri.yml
          grep -F 'name: scriptotar-windows-tauri' .github/workflows/windows-tauri.yml
          grep -F 'name: Build and validate Tauri deb' .github/workflows/linux-tauri.yml
          grep -F 'name: scriptotar-linux-tauri' .github/workflows/linux-tauri.yml
      - name: Verify rolling release race contract
        run: python .github/tests/test_tauri_next_release_race.py

  publish-preview:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && vars.SCRIPTOTAR_NEXT_DISTRIBUTION_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: tauri-next-latest
      STAGING_TAG: tauri-next-staging-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the packaged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 branch, immutable security-backport head
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify complete exact-SHA release gates
        id: gates
        run: python3 scripts/release_ci_gate.py

      - name: Download validated package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux
          gh run download '${{ steps.gates.outputs.windows_run_id }}' \
            --repo "$GITHUB_REPOSITORY" \
            --name scriptotar-windows-tauri \
            --dir dist/windows
          gh run download '${{ steps.gates.outputs.linux_run_id }}' \
            --repo "$GITHUB_REPOSITORY" \
            --name scriptotar-linux-tauri \
            --dir dist/linux

      - name: Stage one cross-platform preview release
        shell: bash
        run: |
          set -euo pipefail

          WINDOWS_VERSION_FILE="$(find dist/windows -type f -name TAURI_VERSION -print -quit)"
          LINUX_VERSION_FILE="$(find dist/linux -type f -name TAURI_VERSION -print -quit)"
          test -n "$WINDOWS_VERSION_FILE"
          test -n "$LINUX_VERSION_FILE"

          WINDOWS_VERSION="$(tr -d '\r\n' < "$WINDOWS_VERSION_FILE")"
          LINUX_VERSION="$(tr -d '\r\n' < "$LINUX_VERSION_FILE")"
          test -n "$WINDOWS_VERSION"
          test "$WINDOWS_VERSION" = "$LINUX_VERSION" || {
            echo "Package version mismatch: Windows=$WINDOWS_VERSION Linux=$LINUX_VERSION" >&2
            exit 1
          }

          WINDOWS_INSTALLER="$(find dist/windows -type f -name 'Scriptotar-Next-*-x64-setup.exe' -print -quit)"
          LINUX_DEB="$(find dist/linux -type f -name 'Scriptotar-Next-*-amd64.deb' -print -quit)"
          WINDOWS_RUNTIME="$(find dist/windows -type f -name RUNTIME-VERSIONS.txt -print -quit)"
          LINUX_RUNTIME="$(find dist/linux -type f -name RUNTIME-VERSIONS.txt -print -quit)"
          LINUX_CONTENTS="$(find dist/linux -type f -name DEB-CONTENTS.txt -print -quit)"

          for file in "$WINDOWS_INSTALLER" "$LINUX_DEB" "$WINDOWS_RUNTIME" "$LINUX_RUNTIME" "$LINUX_CONTENTS"; do
            test -n "$file" && test -s "$file" || { echo 'Required release asset is missing.' >&2; exit 1; }
          done

          mkdir -p latest
          cp "$WINDOWS_INSTALLER" latest/Scriptotar-Next-latest-x64-setup.exe
          cp "$LINUX_DEB" latest/Scriptotar-Next-latest-amd64.deb
          cp "$WINDOWS_RUNTIME" latest/RUNTIME-VERSIONS-windows.txt
          cp "$LINUX_RUNTIME" latest/RUNTIME-VERSIONS-linux.txt
          cp "$LINUX_CONTENTS" latest/DEB-CONTENTS-linux.txt

          (
            cd latest
            sha256sum \
              Scriptotar-Next-latest-x64-setup.exe \
              Scriptotar-Next-latest-amd64.deb \
              RUNTIME-VERSIONS-windows.txt \
              RUNTIME-VERSIONS-linux.txt \
              DEB-CONTENTS-linux.txt \
              > SHA256SUMS.txt
          )

          cat > RELEASE-NOTES.md <<NOTES
          # Scriptotar Next Preview

          Built automatically only after the mandatory exact-SHA CI suite passed on main.

          - Tauri app version: ${WINDOWS_VERSION}
          - Commit: ${SOURCE_SHA}
          - Windows asset: Scriptotar-Next-latest-x64-setup.exe
          - Linux asset: Scriptotar-Next-latest-amd64.deb

          Required release gates: Tauri migration integration, Security hygiene, Windows Tauri Installer, and Linux Tauri Package. Every gate and its mandatory jobs must complete successfully for this exact commit.

          Both packages contain Scriptotar's self-contained transcription runtime, dedicated yt-dlp command, FFmpeg and ffprobe. A separate Python installation is not required.

          Whisper model weights are downloaded on first uncached use. Windows preview builds remain unsigned unless release signing credentials are configured.
          NOTES

      - name: Reject stale source before draft staging
        shell: bash
        run: bash .github/scripts/assert-tauri-next-current-main.sh

      - name: Stage complete release as a draft
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            latest/Scriptotar-Next-latest-x64-setup.exe
            latest/Scriptotar-Next-latest-amd64.deb
            latest/RUNTIME-VERSIONS-windows.txt
            latest/RUNTIME-VERSIONS-linux.txt
            latest/DEB-CONTENTS-linux.txt
            latest/SHA256SUMS.txt
          )

          gh release create "$STAGING_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Scriptotar Next Preview' \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            --draft

          STAGING_RELEASE_ID="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg tag "$STAGING_TAG" \
                '.[] | select(.tag_name == $tag and .draft == true) | .id' |
              head -n 1
          )"
          test -n "$STAGING_RELEASE_ID" || {
            echo "Unable to resolve draft release $STAGING_TAG after creation." >&2
            exit 1
          }
          echo "STAGING_RELEASE_ID=$STAGING_RELEASE_ID" >> "$GITHUB_ENV"

          gh release view "$STAGING_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            > staged-release.json
          test "$(jq -r '.tagName' staged-release.json)" = "$STAGING_TAG"
          test "$(jq -r '.isDraft' staged-release.json)" = true
          test "$(jq -r '.isPrerelease' staged-release.json)" = true

          ASSET_NAMES="$(jq -r '.assets[].name' staged-release.json)"
          for expected in \
            Scriptotar-Next-latest-x64-setup.exe \
            Scriptotar-Next-latest-amd64.deb \
            RUNTIME-VERSIONS-windows.txt \
            RUNTIME-VERSIONS-linux.txt \
            DEB-CONTENTS-linux.txt \
            SHA256SUMS.txt; do
            grep -Fxq "$expected" <<< "$ASSET_NAMES" || {
              echo "Staged release is missing $expected" >&2
              exit 1
            }
          done

      - name: Re-check current main before rolling switch
        shell: bash
        run: bash .github/scripts/assert-tauri-next-current-main.sh

      - name: Switch rolling tag and publish staged release
        shell: bash
        run: |
          set -euo pipefail

          OLD_RELEASE_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id' 2>/dev/null || true
          )"

          if [ -n "$OLD_RELEASE_ID" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID"
          fi

          git tag -f "$RELEASE_TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$SOURCE_SHA" \
            -f name='Scriptotar Next Preview' \
            -F body=@RELEASE-NOTES.md \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            > published-release.json

          test "$(jq -r '.tag_name' published-release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.draft' published-release.json)" = false
          test "$(jq -r '.prerelease' published-release.json)" = true

      - name: Verify published release and rolling tag
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,body,assets,url \
            > release.json

          test "$(jq -r '.tagName' release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' release.json)" = false
          test "$(jq -r '.isPrerelease' release.json)" = true
          jq -r '.body' release.json | grep -Fq -- "- Commit: $SOURCE_SHA"

          ASSET_NAMES="$(jq -r '.assets[].name' release.json)"
          for expected in \
            Scriptotar-Next-latest-x64-setup.exe \
            Scriptotar-Next-latest-amd64.deb \
            RUNTIME-VERSIONS-windows.txt \
            RUNTIME-VERSIONS-linux.txt \
            DEB-CONTENTS-linux.txt \
            SHA256SUMS.txt; do
            grep -Fxq "$expected" <<< "$ASSET_NAMES" || {
              echo "Published release is missing $expected" >&2
              exit 1
            }
          done

          REMOTE_TAG="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          test "$REMOTE_TAG" = "$SOURCE_SHA" || {
            echo "Release tag points to $REMOTE_TAG instead of $SOURCE_SHA" >&2
            exit 1
          }

          RELEASE_URL="$(jq -r '.url' release.json)"
          {
            echo '## Scriptotar Next preview published'
            echo
            echo "- Commit: $SOURCE_SHA"
            echo "- Release: $RELEASE_URL"
            echo '- Exact-SHA integration, security, Windows, and Linux gates passed.'
            echo '- Windows NSIS and Linux Debian assets verified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up unpublished staging release
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${STAGING_RELEASE_ID:-}" ]; then
            STAGING_RELEASE_ID="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null |
                jq -r --arg tag "$STAGING_TAG" \
                  '.[] | select(.tag_name == $tag and .draft == true) | .id' |
                head -n 1 || true
            )"
          fi

          if [ -n "${STAGING_RELEASE_ID:-}" ]; then
            IS_DRAFT="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" --jq '.draft' 2>/dev/null || true
            )"
            if [ "$IS_DRAFT" = true ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID"
            fi
          fi

          if git ls-remote --exit-code origin "refs/tags/$STAGING_TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$STAGING_TAG" || true
          fi

name: Agent07 PR198 corrected parser selftest Linux Windows
on:
  pull_request:
    paths:
      - .github/workflows/agent07-pr198-zip-selftest.yml
      - tests/defragmentation/native-e2e/test_agent07_pr198_zip_cross_os_replay.py
permissions:
  contents: read
jobs:
  corrected-zip-selftest:
    name: Exact-source native ZIP regression replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Authenticate exact Agent07 source and test-only two-file diff
        shell: bash
        run: |
          set -euo pipefail
          BASE=db584639dbf89b0b26c90054b31c4564f9935c1b
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/visual_observations.py)" = c49521e8baf7b32c21c6c839eb5ab6d5c2d49432
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/test_visual_observations.py)" = bd1bddabeff3b330404e7897d26afa8d2048e3d4
          EXPECTED="$(printf '%s\n' .github/workflows/agent07-pr198-zip-selftest.yml tests/defragmentation/native-e2e/test_agent07_pr198_zip_cross_os_replay.py | LC_ALL=C sort)"
          OBSERVED="$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)"
          test "$EXPECTED" = "$OBSERVED"
          echo "PASS exact source identity and only two test-only replay paths"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run original Agent10 undercount negatives and full Agent07 source suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_agent07_pr198_zip_cross_os_replay.py' -v
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_visual_observations.py' -v
          echo "Source-level parser selftest ONLY; not independent security approval or installed-app 16-case evidence"

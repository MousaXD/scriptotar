name: Agent 2 lockfile helper

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/scriptotar-ai/Cargo.toml'
      - '.github/workflows/agent2-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: agent2-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

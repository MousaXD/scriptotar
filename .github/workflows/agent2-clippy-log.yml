name: Agent 2 clippy validation

on:
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/agent2-clippy-log.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          research = Path('crates/scriptotar-research/src/lib.rs')
          text = research.read_text()
          text = text.replace(
              r'''raw.replace('\r', " ").replace('\n', " ")''',
              r'''raw.replace(['\r', '\n'], " ")''',
              1,
          )
          research.write_text(text)

          db = Path('crates/scriptotar-db/src/ai_research.rs')
          text = db.read_text()
          old = 'store.upsert_research_items(&[first.clone()]).unwrap()'
          new = 'store.upsert_research_items(std::slice::from_ref(&first)).unwrap()'
          if old not in text:
              raise SystemExit('expected one-item research slice test was not found')
          db.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Clippy
        env:
          CARGO_TERM_COLOR: never
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --workspace --locked
      - name: Commit tested fixes to temporary branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/scriptotar-research/src/lib.rs crates/scriptotar-db/src/ai_research.rs
          git commit -m 'fix: satisfy Agent 2 Rust quality gates' || true
          git push origin "HEAD:${GITHUB_HEAD_REF}"

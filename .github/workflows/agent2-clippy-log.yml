name: Agent 2 clippy diagnostics

on:
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/agent2-clippy-log.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply first clippy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/scriptotar-research/src/lib.rs')
          text = path.read_text()
          old = r'''raw.replace('\r', " ").replace('\n', " ")'''
          new = r'''raw.replace(['\r', '\n'], " ")'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Capture clippy diagnostics
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > /tmp/clippy.full 2>&1
          code=$?
          {
            grep -E '^(error(\[[^]]+\])?:|warning:| *-->| *\||note:|help:)' /tmp/clippy.full || true
            echo
            echo '--- final clippy output ---'
            tail -n 120 /tmp/clippy.full
          } > agent2-clippy.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/scriptotar-research/src/lib.rs agent2-clippy.log
          git commit -m 'ci: capture Agent 2 clippy diagnostics' || true
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit $code

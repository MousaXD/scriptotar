# Agent10 independent fixed-source unit test of native evidence ZIP and PNG handlers.
# Synthetic archive/PNG fixtures ONLY, never native installed runtime certification.
name: Agent10 PR161 exact visual evidence source unit safety and parity

on:
  push:
    branches: [agent-10/p2-pr161-visual-source-suite-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-suite:
    name: All 14 source-format PNG and Arabic ZIP negatives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout independent test workflow, no repo credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original audit commit before any source execution
        shell: bash
        env:
          TEST_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TEST_HEAD"
      - name: Checkout exact Agent07 four-file QA implementation as DATA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 94f598d87543c9333dff6f489219cf314d77259f
          path: .agent10-pr161-source
          persist-credentials: false
          sparse-checkout: |
            tests/defragmentation/native-e2e/visual_observations.py
            tests/defragmentation/native-e2e/test_visual_observations.py
            tests/defragmentation/native-e2e/native_bidi_geometry_review.py
            tests/defragmentation/native-e2e/test_native_bidi_geometry_review.py
          sparse-checkout-cone-mode: false
      - name: Pin all four committed source blobs and their actual worktree bytes
        shell: bash
        run: |
          set -euo pipefail
          root=.agent10-pr161-source
          prefix=tests/defragmentation/native-e2e
          test "$(git -C "$root" rev-parse HEAD)" = 94f598d87543c9333dff6f489219cf314d77259f
          for entry in \
            "visual_observations.py:7b3dc4e12b04acc0f052403c705e24e117f8d968" \
            "test_visual_observations.py:abcbef2473996c0c9ca925817e977e2f48acd708" \
            "native_bidi_geometry_review.py:d025ee5d12485dca7bbc4c9586a6e31c94532a7b" \
            "test_native_bidi_geometry_review.py:aff0d2fdb26577003131b5fbd9c7a7591824da8c"; do
            name="$(printf '%s' "$entry" | cut -d: -f1)"
            sha="$(printf '%s' "$entry" | cut -d: -f2)"
            test "$(git -C "$root" rev-parse "HEAD:$prefix/$name")" = "$sha"
            test "$(git -C "$root" hash-object "$prefix/$name")" = "$sha"
          done
          git -C "$root" diff --quiet -- "$prefix"
      - name: Pin stdlib Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run EXACT 4 PNG and 10 noncertifying native ZIP source tests
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from pathlib import Path
          directory = Path(".agent10-pr161-source/tests/defragmentation/native-e2e")
          for name, expected in [
              ("test_visual_observations.py", 4),
              ("test_native_bidi_geometry_review.py", 10),
          ]:
              suite = unittest.TestLoader().discover(str(directory), pattern=name)
              actual = suite.countTestCases()
              if actual != expected:
                  raise SystemExit(f"FAIL CLOSED: {name} must execute exactly {expected} source tests, got {actual}")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(f"FAIL CLOSED: native evidence {name} source regression failed")
              print(f"PASS: exact original Agent07 {actual}/{expected} {name} source tests; never installed/native certification", flush=True)
          PY

name: Agent10 independent overlength import-path scope & real Vite compiler (read-only sandbox)

on:
  push:
    branches: [agent-10/p0-prebuild-absolute-import-probe-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source-scope:
    name: Overlength relative import guard negative control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact independent test source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --check tests/defragmentation/security/agent10_prebuild_scope_probe.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent10-trusted-guard
          persist-credentials: false
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
      - name: Verify immutable reviewed scanner SHA
        shell: bash
        run: |
          test "$(git -C .agent10-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
      - name: Adversarial imported source scanner (RED if path cap bypasses)
        shell: bash
        run: node tests/defragmentation/security/agent10_prebuild_scope_probe.mjs

  bounded-compiler:
    name: Real bounded Vite overlength path reachability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact test HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          node --check tests/defragmentation/security/agent10_vite_scope_reachability.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install true checked-in Vite 7.3.7 lock tree
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Clean baseline then kill each hostile real Vite build after 12 seconds
        shell: bash
        run: node tests/defragmentation/security/agent10_vite_scope_reachability.mjs

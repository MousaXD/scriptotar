name: Agent10 original PR198 EOCD directory-count adversarial negative
on:
  pull_request:
    paths:
      - .github/workflows/agent10-pr198-eocd-underreported-negative.yml
      - tests/defragmentation/native-e2e/test_agent10_visual_eocd_underreport.py
permissions:
  contents: read
jobs:
  actual-zip-underreport:
    name: Frozen PR198 EOCD count bypass (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin original PR198 source and exact test-only scope before running
        shell: bash
        run: |
          set -euo pipefail
          BASE=368ac5bb89f577b893cc38e54ec91f7263f444d9
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/visual_observations.py)" = 3dcbdd3e61926f1f0d83884edd14735c2872ef77
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/test_visual_observations.py)" = 2083c354aa9595144e76e489fc41679823cbdaab
          EXPECTED="$(printf '%s\n' .github/workflows/agent10-pr198-eocd-underreported-negative.yml tests/defragmentation/native-e2e/test_agent10_visual_eocd_underreport.py | LC_ALL=C sort)"
          OBSERVED="$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)"
          test "$EXPECTED" = "$OBSERVED"
          echo "PASS immutable original PR198 source and two test-only paths"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original benign and forged EOCD tests (not installed-app certification)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_*visual*.py' -v
          echo "NEGATIVE PROOF: a green underreported-directory test means source is NOT SOURCE-APPROVED"

name: Transcription Sidecar

on:
  push:
    branches:
      - main
      - 'rewrite/**'
    paths:
      - 'sidecars/transcription/**'
      - '.github/workflows/transcription-sidecar.yml'
  pull_request:
    paths:
      - 'sidecars/transcription/**'
      - '.github/workflows/transcription-sidecar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcription-sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python protocol and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sidecar sources
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m compileall -q .
      - name: Unit and subprocess protocol tests
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  dependency-imports:
    name: Real engine dependency imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/transcription/requirements-engine.txt
      - name: Install pinned engine dependencies
        run: python -m pip install -r sidecars/transcription/requirements-engine.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify real imports without model download
        run: |
          python - <<'PY'
          import faster_whisper
          import yt_dlp
          print("faster-whisper", faster_whisper.__version__)
          print("yt-dlp", yt_dlp.version.__version__)
          PY

  agent8-whisper-canary:
    name: Agent 8 real Whisper canary verification
    if: github.event_name == 'pull_request' && github.head_ref == 'test/whisper-runtime-canary'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CANARY_MODEL: small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sidecars/transcription/requirements-engine.txt
            sidecars/transcription/requirements-bundle.txt
      - name: Install deterministic speech fixture generator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install pinned packaged-runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
      - name: Build self-contained transcription runtime
        run: |
          set -euo pipefail
          python sidecars/transcription/build_runtime.py \
            --output "$RUNNER_TEMP/scriptotar-transcription-runtime"
      - name: Validate packaged runtime before real inference
        run: |
          set -euo pipefail
          python sidecars/transcription/validate_runtime.py \
            "$RUNNER_TEMP/scriptotar-transcription-runtime"
      - name: Download model and run real packaged inference twice
        shell: bash
        run: |
          set -euo pipefail
          python sidecars/transcription/whisper_runtime_canary.py \
            --runtime "$RUNNER_TEMP/scriptotar-transcription-runtime" \
            --work-dir "$RUNNER_TEMP/whisper-canary-work" \
            --model "$CANARY_MODEL" \
            --timeout-seconds 1200 \
            --summary-json "$RUNNER_TEMP/whisper-canary-summary.json" \
            2>&1 | tee whisper-canary.log
      - name: Upload canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-whisper-runtime-canary-diagnostics
          path: |
            whisper-canary.log
            ${{ runner.temp }}/whisper-canary-summary.json
            ${{ runner.temp }}/scriptotar-transcription-runtime/RUNTIME-VERSIONS.txt
          if-no-files-found: warn
          retention-days: 14

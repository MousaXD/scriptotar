# Keep this standalone sidecar contract independently runnable alongside Tauri integration.
name: Transcription Sidecar

on:
  push:
    branches:
      - main
      - 'rewrite/**'
    paths:
      - 'sidecars/transcription/**'
      - '.github/workflows/transcription-sidecar.yml'
  pull_request:
    paths:
      - 'sidecars/transcription/**'
      - '.github/workflows/transcription-sidecar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcription-sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python protocol and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile sidecar sources
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m compileall -q .
      - name: Unit and subprocess protocol tests
        working-directory: sidecars/transcription
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  dependency-imports:
    name: Real engine dependency imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/transcription/requirements-engine.txt
      - name: Install pinned engine dependencies
        run: python -m pip install -r sidecars/transcription/requirements-engine.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify real imports without model download
        run: |
          python - <<'PY'
          import faster_whisper
          import yt_dlp
          print("faster-whisper", faster_whisper.__version__)
          print("yt-dlp", yt_dlp.version.__version__)
          PY

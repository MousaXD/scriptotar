# Agent11 runtime containment-only: original untouched 19 and expanded 12
# security probes MUST REMAIN RED on VM timeout exceptions; this runner only
# asserts no OS kill timeouts and explicit fail-closed errors.
name: Agent11 unchanged 19 plus 12 picomatch VM containment classification (not remediation)

on:
  push:
    branches:
      - agent-11/p0-picomatch-candidate-evaluation-20261120
    paths:
      - '.github/workflows/agent11-vm-unchanged-19-12-corpus-containment.yml'
      - 'tests/defragmentation/security/agent11_vm_original_corpora_containment.mjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_candidate.cjs'
      - 'tests/defragmentation/security/agent11_vm_regex_wrapper_preload.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-suites-must-stay-red-on-timeout:
    name: OS-original corpora fail closed but still FAIL strict boolean contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - name: Checkout exact experimental source SHA without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22 installed original build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout immutable pinned source guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout immutable original 19-case parser corpus (NEVER modify)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 292e408087d8b48bc012e52d1f3e7ab0c8b89650
          path: .agent11-original-corpus
          sparse-checkout: |
            apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact trusted original inputs and source guard BEFORE npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .agent11-trusted-guard rev-parse HEAD)" = "55ce3ac389b7e1fcab99b3a5acc84b526630af72"
          test "$(git -C .agent11-original-corpus rev-parse HEAD)" = "292e408087d8b48bc012e52d1f3e7ab0c8b89650"
          test "$(git hash-object apps/desktop-ui/package-lock.json)" = "eebc9228dd404f0b9f9bd55f2665ab3e00fe9dfa"
          node --check tests/defragmentation/security/agent11_vm_original_corpora_containment.mjs
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      - name: Install pinned original official toolchain (NO parser replacement)
        shell: bash
        run: npm ci --prefix apps/desktop-ui
      - name: Copy immutable case source and run independent containment classification
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          cp .agent11-original-corpus/apps/desktop-ui/scripts/probe-picomatch-redos.mjs apps/desktop-ui/scripts/probe-picomatch-redos.mjs
          node tests/defragmentation/security/agent11_vm_original_corpora_containment.mjs
          git diff --exit-code -- apps/desktop-ui/package.json apps/desktop-ui/package-lock.json
          echo 'Both original probes intentionally remain FAIL under fail-closed timeout exceptions; this is NOT a parser repair.'

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Repository hygiene and action pinning
        run: |
          python3 scripts/check_repo_hygiene.py
          python3 scripts/check_github_action_pins.py

      - name: Version identity tests
        run: python3 tests/test_version_identity.py -v

      - name: Svelte frontend tests
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run check
          npm test -- --run
          npm run build

      - name: Python sidecar tests
        run: PYTHONPATH=sidecars/transcription python3 -m unittest discover -s sidecars/transcription/tests -v

      - name: Rust workspace tests
        run: cargo test --workspace

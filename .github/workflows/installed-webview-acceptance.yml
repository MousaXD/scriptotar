name: Independent Installed WebView Acceptance

on:
  pull_request:
    paths:
      - 'tests/defragmentation/native-e2e/**'
      - '.github/workflows/installed-webview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-webview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-webkit:
    name: Installed Linux WebKitGTK / AT-SPI (fail closed)
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXACT_RUN: https://github.com/MousaXD/scriptotar/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact immutable source
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install package builder and real graphical testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libdbus-1-dev pkg-config patchelf \
            xauth xvfb dbus-x11 at-spi2-core python3-pyatspi \
            python3-gi xdotool scrot zenity
          cargo install tauri-cli --version 2.11.2 --locked
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
      - name: Verify native runner without faking application tests
        run: |
          /usr/bin/python3 -m py_compile tests/defragmentation/native-e2e/linux_webkit.py
          /usr/bin/python3 -m unittest discover -s tests/defragmentation/native-e2e -p 'test_*.py' -v
      - name: Prepare included runtime and network tool resources
        run: |
          python sidecars/transcription/build_runtime.py --output apps/desktop/src-tauri/resources/transcription-runtime
          python sidecars/transcription/validate_runtime.py apps/desktop/src-tauri/resources/transcription-runtime
          python scripts/prepare_mcp_tools.py --platform linux --output apps/desktop/src-tauri/resources/mcp-tools
      - name: Configure Linux .deb
        working-directory: apps/desktop
        run: |
          cargo tauri icon ../../scriptotar.svg --output src-tauri/icons
          cat > src-tauri/tauri.linux.conf.json <<'JSON'
          {
            "bundle": {
              "active": true,
              "targets": ["deb"],
              "resources": {
                "resources/transcription-runtime/": "transcription-runtime/",
                "resources/mcp-tools/": "mcp-tools/"
              },
              "icon": ["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.png"],
              "linux": {"deb": {"depends": ["zenity"]}}
            }
          }
          JSON
      - name: Build real release frontend
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Bundle exact-source .deb
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb -- --locked
      - name: Install actual .deb
        run: |
          set -euo pipefail
          mkdir -p native-evidence/linux
          DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" native-evidence/linux/installed.deb
          sudo apt-get install -y "$PWD/native-evidence/linux/installed.deb"
          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          dpkg-query -W -f='${Status}\n' "$PACKAGE" | grep -q 'install ok installed'
          BIN="$(dpkg -L "$PACKAGE" | grep '^/usr/bin/' | head -n 1)"
          test -x "$BIN"
          printf 'APP_BIN=%s\n' "$BIN" >> "$GITHUB_ENV"
          printf 'DEB_PACKAGE=%s\n' "$PACKAGE" >> "$GITHUB_ENV"
          sha256sum "$DEB" "$BIN" > native-evidence/linux/SHA256SUMS.txt
          uname -a > native-evidence/linux/host.txt
          head -n 3 /proc/meminfo >> native-evidence/linux/host.txt
      - name: Exercise installed WebKitGTK accessibility and real UI
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- \
            env NO_AT_BRIDGE=0 GTK_A11Y=1 \
            /usr/bin/python3 tests/defragmentation/native-e2e/linux_webkit.py \
              --executable "$APP_BIN" \
              --package native-evidence/linux/installed.deb \
              --source-sha "$EXACT_SHA" \
              --run-url "$EXACT_RUN" \
              --output native-evidence/linux
      - name: Remove installed test package
        if: always()
        run: |
          if [ -n "${{ env.DEB_PACKAGE }}" ]; then
            sudo apt-get remove -y "${{ env.DEB_PACKAGE }}" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-webkit-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence/linux/
          if-no-files-found: warn
          retention-days: 30

  windows-webview2:
    name: Installed Windows WebView2 / UI Automation (fail closed)
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXACT_RUN: https://github.com/MousaXD/scriptotar/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact immutable source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXACT_SHA) { throw 'Source mismatch' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build Windows runtime dependencies
        run: |
          npm install --global @tauri-apps/cli@2.11.2
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
          python sidecars/transcription/build_runtime.py --output apps/desktop/src-tauri/resources/transcription-runtime
          python sidecars/transcription/validate_runtime.py apps/desktop/src-tauri/resources/transcription-runtime
          python scripts/prepare_mcp_tools.py --platform windows --output apps/desktop/src-tauri/resources/mcp-tools
      - name: Configure NSIS package
        shell: pwsh
        working-directory: apps/desktop
        run: |
          tauri icon ../../scriptotar.svg --output src-tauri/icons
          @'
          {
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "resources": {
                "resources/transcription-runtime/": "transcription-runtime/",
                "resources/mcp-tools/": "mcp-tools/"
              },
              "icon": ["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.ico"],
              "windows": {"nsis": {"installMode": "currentUser"}}
            }
          }
          '@ | Set-Content -Encoding utf8 src-tauri/tauri.windows.conf.json
      - name: Build real frontend
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Bundle exact-source NSIS installer
        run: |
          cargo build --release --locked -p scriptotar-desktop
          cd apps/desktop
          tauri bundle
      - name: Stage installer and machine evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-evidence/windows | Out-Null
          $setup = Get-ChildItem -Path . -Recurse -Filter '*-setup.exe' | Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup.exe not found' }
          Copy-Item $setup.FullName native-evidence/windows/installed-setup.exe
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize |
            ConvertTo-Json | Set-Content native-evidence/windows/host.json
      - name: Probe installed WebView2 UIA (not process-only)
        shell: pwsh
        run: |
          & tests/defragmentation/native-e2e/windows_webview2.ps1 -Installer (Resolve-Path native-evidence/windows/installed-setup.exe).Path -SourceSha $env:EXACT_SHA -RunUrl $env:EXACT_RUN -EvidenceDir native-evidence/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-webview2-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence/windows/
          if-no-files-found: warn
          retention-days: 30

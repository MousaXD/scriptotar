name: Independent Installed WebView Acceptance

on:
  pull_request:
    paths:
      - 'tests/defragmentation/native-e2e/**'
      - '.github/workflows/installed-webview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-webview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-webkit:
    name: Installed Linux WebKitGTK / AT-SPI (fail closed)
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXACT_RUN: https://github.com/MousaXD/scriptotar/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact immutable source
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout immutable reviewed Agent11 pre-Vite gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          persist-credentials: false
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
      - name: Validate pinned prebuild guard and audited PR source before npm/Vite
        shell: bash
        working-directory: .
        run: |
          # Authenticate the actual checkout file, not just git HEAD.
          set -euo pipefail
          trusted=.agent11-trusted-guard
          guard=apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          test "$(git -C "$trusted" rev-parse HEAD)" = '55ce3ac389b7e1fcab99b3a5acc84b526630af72'
          test "$(git -C "$trusted" rev-parse "HEAD:$guard")" = '5c746abd3caf414ba2c80be825d66983312236c6'
          test "$(git -C "$trusted" hash-object --path="$guard" "$guard")" = '5c746abd3caf414ba2c80be825d66983312236c6'
          git -C "$trusted" diff --quiet -- "$guard"
          node -e "if(require('child_process').execFileSync('git',['-C','.agent11-trusted-guard','rev-parse','HEAD'],{encoding:'utf8'}).trim()!=='55ce3ac389b7e1fcab99b3a5acc84b526630af72')process.exit(1)"
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      # The Vite guard does not scan Python/runtime/QA sources. Permit only
      # independently reviewed executable inputs before pip, Python, Rust or npm.
      - name: Verify reviewed Python/runtime/QA inputs before script execution
        shell: bash
        run: |
          set -euo pipefail
          reviewed=e48bfc6848000a4c2b49cf26b8d68da504172df0
          git fetch --no-tags --depth=1 origin "$reviewed"
          test "$(git cat-file -t "$reviewed")" = commit
          # This PR is reviewed for TWO workflow edits only. Fail closed for
          # any changed Rust build script, Cargo/npm hook, Python, resource,
          # GitHub action, or other committed input outside that exact scope.
          # The explicit Python check below is retained as defense-in-depth.
          if ! git diff --quiet "$reviewed" HEAD -- . \
            ':(exclude).github/workflows/windows-tauri.yml' \
            ':(exclude).github/workflows/installed-webview-acceptance.yml' \
            ':(exclude).github/workflows/linux-tauri.yml'; then
            echo "::error::PR158 changed a file outside its two independently reviewed workflow paths."
            exit 1
          fi
          if ! git diff --quiet "$reviewed" HEAD -- \
            sidecars/transcription/ scripts/ tests/defragmentation/native-e2e/ \
            ':(glob)**/*.py' ':(glob)**/requirements*.txt' \
            ':(glob)**/pyproject.toml' ':(glob)**/setup.py' \
            ':(glob)**/setup.cfg' ':(glob)**/Pipfile*' ':(glob)**/tox.ini'; then
            echo "::error::Unreviewed Python/runtime/QA executable or dependency file; pin a new independently reviewed baseline before executing PR-controlled code."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Pure-stdlib QA source regressions fail before expensive native installs.
      # This check never substitutes for a real installed WebKitGTK acceptance.
      - name: Verify native runner without faking application tests
        run: |
          /usr/bin/python3 -m py_compile tests/defragmentation/native-e2e/linux_webkit.py
          /usr/bin/python3 -m py_compile tests/defragmentation/native-e2e/linux_real_media_attempt.py
          /usr/bin/python3 -m py_compile tests/defragmentation/native-e2e/real_study_lineage.py
          # Use the pinned Python 3.12 for the TOML lockfile regression tests;
          # /usr/bin/python3 remains the actual native pyatspi interpreter.
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install package builder and real graphical testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libdbus-1-dev pkg-config patchelf \
            xauth xvfb dbus-x11 at-spi2-core python3-pyatspi \
            python3-gi xdotool scrot zenity openbox
          cargo install tauri-cli --version 2.11.2 --locked
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
      - name: Prepare included runtime and network tool resources
        run: |
          python sidecars/transcription/build_runtime.py --output apps/desktop/src-tauri/resources/transcription-runtime
          python sidecars/transcription/validate_runtime.py apps/desktop/src-tauri/resources/transcription-runtime
          python scripts/prepare_mcp_tools.py --platform linux --output apps/desktop/src-tauri/resources/mcp-tools
      - name: Configure Linux .deb
        working-directory: apps/desktop
        run: |
          cargo tauri icon ../../scriptotar.svg --output src-tauri/icons
          cat > src-tauri/tauri.linux.conf.json <<'JSON'
          {
            "bundle": {
              "active": true,
              "targets": ["deb"],
              "resources": {
                "resources/transcription-runtime/": "transcription-runtime/",
                "resources/mcp-tools/": "mcp-tools/"
              },
              "icon": ["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.png"],
              "linux": {"deb": {"depends": ["zenity"]}}
            }
          }
          JSON
      - name: Build real release frontend
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Bundle exact-source .deb
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb -- --locked
      - name: Install actual .deb
        run: |
          set -euo pipefail
          mkdir -p native-evidence/linux
          DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$DEB"
          cp "$DEB" native-evidence/linux/installed.deb
          sudo apt-get install -y "$PWD/native-evidence/linux/installed.deb"
          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          dpkg-query -W -f='${Status}\n' "$PACKAGE" | grep -q 'install ok installed'
          BIN="$(dpkg -L "$PACKAGE" | grep '^/usr/bin/' | head -n 1)"
          test -x "$BIN"
          printf 'APP_BIN=%s\n' "$BIN" >> "$GITHUB_ENV"
          printf 'DEB_PACKAGE=%s\n' "$PACKAGE" >> "$GITHUB_ENV"
          sha256sum "$DEB" "$BIN" > native-evidence/linux/SHA256SUMS.txt
          uname -a > native-evidence/linux/host.txt
          head -n 3 /proc/meminfo >> native-evidence/linux/host.txt
      - name: Exercise installed WebKitGTK accessibility and real UI
        run: |
          # A real window manager is needed for actual Alt+F4 graphical quit
          # and focus, not merely Xvfb screenshot/process smoke.
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox --sm-disable > native-evidence/linux/openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 1
            env NO_AT_BRIDGE=0 GTK_A11Y=1 GTK_MODULES=atk-bridge \
              /usr/bin/python3 tests/defragmentation/native-e2e/linux_webkit.py \
                --executable "$APP_BIN" \
                --package native-evidence/linux/installed.deb \
                --source-sha "$EXACT_SHA" \
                --run-url "$EXACT_RUN" \
                --output native-evidence/linux
          '
      # This is an independent optional, fail-closed evidence addendum after
      # the 16-case runner. It never edits native result.json or promotes an
      # unproven test to PASS; a blocked media/model/UI step stays NOT TESTED.
      - name: Attempt genuine two-origin native Queue + bundled sidecar + Study (noncertifying)
        if: always()
        continue-on-error: true
        timeout-minutes: 32
        run: |
          set -euo pipefail
          if [ -z "${APP_BIN:-}" ] || [ ! -x "${APP_BIN:-/not-found}" ] || [ ! -f native-evidence/linux/installed.deb ]; then
            echo "Native package unavailable: two-source real media addendum NOT TESTED"
            exit 0
          fi
          FFMPEG=apps/desktop/src-tauri/resources/transcription-runtime/ffmpeg/ffmpeg
          FFPROBE=apps/desktop/src-tauri/resources/transcription-runtime/ffmpeg/ffprobe
          if [ ! -x "$FFMPEG" ]; then FFMPEG="$(command -v ffmpeg || echo ffmpeg)"; fi
          if [ ! -x "$FFPROBE" ]; then FFPROBE="$(command -v ffprobe || echo ffprobe)"; fi
          export FFMPEG FFPROBE
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox --sm-disable > native-evidence/linux/two-source-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 1
            env NO_AT_BRIDGE=0 GTK_A11Y=1 GTK_MODULES=atk-bridge \
              /usr/bin/python3 tests/defragmentation/native-e2e/linux_real_media_attempt.py \
                --executable "$APP_BIN" \
                --package native-evidence/linux/installed.deb \
                --source-sha "$EXACT_SHA" \
                --run-url "$EXACT_RUN" \
                --evidence-dir native-evidence/linux \
                --ffmpeg "$FFMPEG" --ffprobe "$FFPROBE"
          '
          echo "Two-source addendum produces partial evidence, never a native PASS"
      - name: Remove installed test package
        if: always()
        run: |
          if [ -n "${{ env.DEB_PACKAGE }}" ]; then
            sudo apt-get remove -y "${{ env.DEB_PACKAGE }}" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-webkit-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence/linux/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload small Linux GUI evidence separately for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-webkit-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-evidence/linux/result.json
            native-evidence/linux/a11y-diagnostics.json
            native-evidence/linux/process-exit.json
            native-evidence/linux/arabic-transition.json
            native-evidence/linux/desktop.log
            native-evidence/linux/openbox.log
            native-evidence/linux/SHA256SUMS.txt
            native-evidence/linux/host.txt
            native-evidence/linux/two-source-attempt.json
            native-evidence/linux/two-source-desktop.log
            native-evidence/linux/two-real-origins/origin-manifest.json
            native-evidence/linux/*.png
          if-no-files-found: warn
          retention-days: 30

  windows-webview2:
    name: Installed Windows WebView2 / UI Automation (fail closed)
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXACT_RUN: https://github.com/MousaXD/scriptotar/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact immutable source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXACT_SHA) { throw 'Source mismatch' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout immutable reviewed Agent11 pre-Vite gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: 55ce3ac389b7e1fcab99b3a5acc84b526630af72
          path: .agent11-trusted-guard
          persist-credentials: false
          sparse-checkout: |
            apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          sparse-checkout-cone-mode: false
      - name: Validate pinned prebuild guard and audited PR source before npm/Vite
        shell: bash
        working-directory: .
        run: |
          # Authenticate the actual checkout file, not just git HEAD.
          set -euo pipefail
          trusted=.agent11-trusted-guard
          guard=apps/desktop-ui/scripts/guard-vite-build-patterns.mjs
          test "$(git -C "$trusted" rev-parse HEAD)" = '55ce3ac389b7e1fcab99b3a5acc84b526630af72'
          test "$(git -C "$trusted" rev-parse "HEAD:$guard")" = '5c746abd3caf414ba2c80be825d66983312236c6'
          test "$(git -C "$trusted" hash-object --path="$guard" "$guard")" = '5c746abd3caf414ba2c80be825d66983312236c6'
          git -C "$trusted" diff --quiet -- "$guard"
          node -e "if(require('child_process').execFileSync('git',['-C','.agent11-trusted-guard','rev-parse','HEAD'],{encoding:'utf8'}).trim()!=='55ce3ac389b7e1fcab99b3a5acc84b526630af72')process.exit(1)"
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --self-test
          node .agent11-trusted-guard/apps/desktop-ui/scripts/guard-vite-build-patterns.mjs --workspace apps/desktop-ui
      # The Vite guard does not scan Python/runtime/QA sources. Permit only
      # independently reviewed executable inputs before pip, Python, Rust or npm.
      - name: Verify reviewed Python/runtime/QA inputs before script execution
        shell: bash
        run: |
          set -euo pipefail
          reviewed=e48bfc6848000a4c2b49cf26b8d68da504172df0
          git fetch --no-tags --depth=1 origin "$reviewed"
          test "$(git cat-file -t "$reviewed")" = commit
          # This PR is reviewed for TWO workflow edits only. Fail closed for
          # any changed Rust build script, Cargo/npm hook, Python, resource,
          # GitHub action, or other committed input outside that exact scope.
          # The explicit Python check below is retained as defense-in-depth.
          if ! git diff --quiet "$reviewed" HEAD -- . \
            ':(exclude).github/workflows/windows-tauri.yml' \
            ':(exclude).github/workflows/installed-webview-acceptance.yml' \
            ':(exclude).github/workflows/linux-tauri.yml'; then
            echo "::error::PR158 changed a file outside its two independently reviewed workflow paths."
            exit 1
          fi
          if ! git diff --quiet "$reviewed" HEAD -- \
            sidecars/transcription/ scripts/ tests/defragmentation/native-e2e/ \
            ':(glob)**/*.py' ':(glob)**/requirements*.txt' \
            ':(glob)**/pyproject.toml' ':(glob)**/setup.py' \
            ':(glob)**/setup.cfg' ':(glob)**/Pipfile*' ':(glob)**/tox.ini'; then
            echo "::error::Unreviewed Python/runtime/QA executable or dependency file; pin a new independently reviewed baseline before executing PR-controlled code."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Parse real native UIA source before downloading expensive runtime tools.
      # Syntax success is not installed WebView2 acceptance.
      - name: Verify Windows native UIA probe syntax early
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tests/defragmentation/native-e2e/windows_webview2.ps1').Path,
            [ref] $tokens, [ref] $parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Native Windows UIA probe did not parse'
          }
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build Windows runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
          python sidecars/transcription/build_runtime.py --output apps/desktop/src-tauri/resources/transcription-runtime
          python sidecars/transcription/validate_runtime.py apps/desktop/src-tauri/resources/transcription-runtime
          python scripts/prepare_mcp_tools.py --platform windows --output apps/desktop/src-tauri/resources/mcp-tools
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.2
      - name: Configure NSIS package
        shell: pwsh
        working-directory: apps/desktop
        run: |
          tauri icon ../../scriptotar.svg --output src-tauri/icons
          @'
          {
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "resources": {
                "resources/transcription-runtime/": "transcription-runtime/",
                "resources/mcp-tools/": "mcp-tools/"
              },
              "icon": ["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.ico"],
              "windows": {"nsis": {"installMode": "currentUser"}}
            }
          }
          '@ | Set-Content -Encoding utf8 src-tauri/tauri.windows.conf.json
      - name: Build real frontend
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Build production-mode release binary and NSIS installer
        working-directory: apps/desktop
        run: |
          # IMPORTANT: `cargo build --release` followed by `tauri bundle` can
          # package a devUrl binary that tries http://localhost:5173. The
          # installed WebView2 then displays ERR_CONNECTION_REFUSED instead of
          # embedded frontend assets. Let Tauri set the production build mode.
          # The JS Tauri CLI does not accept cargo's '-- --locked'. Check
          # Cargo's resolved lock graph before/after its own production build.
          # On Windows Cargo 1.97 can reorder package.dependencies in Cargo.lock
          # (same IDs/versions/checksums), so raw byte diff is not a legitimate
          # dependency drift signal. This canonical TOML hash remains strict:
          # any real package, source, checksum or dependency change fails.
          $lockPath = (Resolve-Path '../../Cargo.lock').Path
          $fingerprinter = (Resolve-Path '../../tests/defragmentation/native-e2e/cargo_lock_fingerprint.py').Path
          cargo metadata --locked --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock is not reproducible' }
          $lockBefore = python $fingerprinter $lockPath
          if ($LASTEXITCODE -ne 0 -or -not $lockBefore) { throw 'Could not fingerprint exact Cargo.lock before build' }
          tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Production NSIS Tauri build failed' }
          cargo metadata --locked --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock cannot be resolved after build' }
          $lockAfter = python $fingerprinter $lockPath
          if ($LASTEXITCODE -ne 0 -or $lockBefore -ne $lockAfter) {
            throw 'NSIS release build changed the resolved Cargo.lock dependency graph'
          }
      - name: Stage installer and machine evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-evidence/windows | Out-Null
          $setup = Get-ChildItem -Path . -Recurse -Filter '*-setup.exe' | Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup.exe not found' }
          Copy-Item $setup.FullName native-evidence/windows/installed-setup.exe
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize |
            ConvertTo-Json | Set-Content native-evidence/windows/host.json
      - name: Probe installed WebView2 UIA (not process-only)
        shell: pwsh
        run: |
          & tests/defragmentation/native-e2e/windows_webview2.ps1 -Installer (Resolve-Path native-evidence/windows/installed-setup.exe).Path -SourceSha $env:EXACT_SHA -RunUrl $env:EXACT_RUN -EvidenceDir native-evidence/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-webview2-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence/windows/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload small Windows UIA evidence separately for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-webview2-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-evidence/windows/result.json
            native-evidence/windows/uia-diagnostics.json
            native-evidence/windows/host.json
            native-evidence/windows/*.png
          if-no-files-found: warn
          retention-days: 30

name: Scriptotar MCP E2E
on:
  pull_request:
    paths:
      - 'crates/scriptotar-mcp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mcp-e2e.yml'
      - 'tests/mcp_stdio_e2e.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: rustfmt --check --edition 2021 crates/scriptotar-mcp/src/main.rs
      - run: cargo test -p scriptotar-mcp --locked
      - run: cargo build -p scriptotar-mcp --locked
      - run: python3 tests/mcp_stdio_e2e.py

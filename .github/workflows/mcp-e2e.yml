name: Scriptotar MCP E2E
on:
  pull_request:
    paths:
      - 'crates/scriptotar-mcp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mcp-e2e.yml'
      - 'tests/mcp_stdio_e2e.py'
      - 'tests/mcp_http_e2e.py'
      - 'tests/mcp_desktop_cli_e2e.py'
      - 'tests/mcp_installed_smoke.py'
      - 'tests/test_mcp_tool_bundle.py'
      - 'scripts/prepare_mcp_tools.py'
      - 'apps/desktop-ui/src/**'
      - 'apps/desktop/src-tauri/src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test -p scriptotar-mcp --locked
      - run: cargo build -p scriptotar-mcp --locked
      - run: python3 tests/mcp_stdio_e2e.py
      - run: python3 tests/mcp_http_e2e.py
      - run: python3 -m unittest discover -s tests -p test_mcp_tool_bundle.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - run: npm ci --prefix apps/desktop-ui
      - run: npm run check --prefix apps/desktop-ui
      - run: npm run test --prefix apps/desktop-ui -- --run
      - run: npm run build --prefix apps/desktop-ui
      - name: Install Linux desktop dependencies for Tauri host compile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libdbus-1-dev pkg-config patchelf
      - name: Compile real Tauri MCP settings and local gateway host
        run: cargo check -p scriptotar-desktop --locked
      - name: Run connection manager and gateway security tests
        run: cargo test -p scriptotar-desktop --lib --locked mcp_connect::tests
      - name: Compile desktop executable with headless MCP entrypoint
        run: cargo build -p scriptotar-desktop --bin scriptotar-desktop --locked
      - name: Exercise desktop CLI MCP default-deny behavior
        run: python3 tests/mcp_installed_smoke.py --binary target/debug/scriptotar-desktop
      - name: Exercise desktop binary, research and transcription with deterministic providers
        run: python3 tests/mcp_desktop_cli_e2e.py
      - name: Verify packaged runtime directory detection
        run: cargo test -p scriptotar-desktop --lib --locked discovers_linux_packaged_runtime_for_headless_mcp

name: Agent10 independent PR198 raw ZIP central-directory re-audit
on:
  pull_request:
    paths:
      - .github/workflows/agent10-pr198-raw-central-directory.yml
      - tests/defragmentation/native-e2e/test_agent10_raw_zip_directory_preindex.py
permissions:
  contents: read
jobs:
  actual-directory-scan:
    name: Raw ZIP directory preindex reject (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Authenticate original revised PR198 parser source and narrow test-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=ac6e3f026b880ac92a89e05b35b72aa4b81d6c19
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/visual_observations.py)" = c49521e8baf7b32c21c6c839eb5ab6d5c2d49432
          test "$(git rev-parse HEAD:tests/defragmentation/native-e2e/test_visual_observations.py)" = def33dd3590052905470a3dc16faf02609ba017c
          EXPECTED="$(printf '%s\n' .github/workflows/agent10-pr198-raw-central-directory.yml tests/defragmentation/native-e2e/test_agent10_raw_zip_directory_preindex.py | LC_ALL=C sort)"
          OBSERVED="$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)"
          test "$EXPECTED" = "$OBSERVED"
          echo "PASS immutable updated PR198 source Git blobs plus only two test files"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute independent forged-count and original complete ZIP parser negatives
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_agent10_raw_zip_directory_preindex.py' -v
          python -m unittest discover -s tests/defragmentation/native-e2e -p 'test_visual_observations.py' -v
          echo "PASS source-level ZIP parser unit tests only; NOT installed QA or release certification"

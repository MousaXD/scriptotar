# Independent negative evidence only. PR170 source checkout is immutable and authenticated.
# Expected GREEN only if exact native_ui_trace rejects duplicate JSON object member names.
name: Agent10 native JSONL duplicate-key adversarial veto

on:
  push:
    branches: [agent-10/p0-native-json-fix-independent-retest-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-evidence:
    name: Exact-source contradictory JSONL fields (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout independent Agent10 test, no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate independently authored exact test SHA
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Checkout exact PR170 native parser as DATA only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MousaXD/scriptotar
          ref: dc169a9bf4aa4029abcb4018d33ec16d3bf208da
          path: .agent10-pr170-data
          persist-credentials: false
          sparse-checkout: |
            tests/defragmentation/benchmarks/native_ui_trace.py
          sparse-checkout-cone-mode: false
      - name: Verify exact candidate source bytes BEFORE executing parser
        shell: bash
        run: |
          set -euo pipefail
          data=.agent10-pr170-data
          path=tests/defragmentation/benchmarks/native_ui_trace.py
          test "$(git -C "$data" rev-parse HEAD)" = dc169a9bf4aa4029abcb4018d33ec16d3bf208da
          test "$(git -C "$data" rev-parse "HEAD:$path")" = 285fd92051c3202f56ee0e67aeb185610377e2bf
          test "$(git -C "$data" hash-object "$path")" = 285fd92051c3202f56ee0e67aeb185610377e2bf
          git -C "$data" diff --quiet -- "$path"
      - name: Set reproducible Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent 5 contradictory provenance-key negatives (must be GREEN)
        shell: bash
        run: python tests/defragmentation/security/agent10_native_trace_duplicate_json.py --candidate .agent10-pr170-data

name: Independent security regressions

on:
  pull_request:
    paths:
      - '.github/workflows/independent-security-regressions.yml'
      - 'tests/defragmentation/security/**'
      - 'docs/defragmentation/handoffs/p0-security-certification.md'
  workflow_dispatch:
    inputs:
      integration_sha:
        description: 'Exact 40-character PR #114 commit SHA for both combined gates'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit-windows-denial-integrity:
    name: "Security / Windows source-pinned native denial anti-spoof"
    needs: [pin-features]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact Agent 10 audit source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout exact Agent 07 native Windows runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ fromJSON(needs.pin-features.outputs.shas)['131'] }}
          path: native
          persist-credentials: false
      - name: Reject stale, unrelated, duplicate or unbound Windows denial evidence
        shell: pwsh
        env:
          EXPECTED_AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_NATIVE_SHA: ${{ fromJSON(needs.pin-features.outputs.shas)['131'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C audit rev-parse HEAD) -cne $env:EXPECTED_AUDIT_SHA) {
            throw 'Wrong audit source checked out on Windows'
          }
          if ((git -C native rev-parse HEAD) -cne $env:EXPECTED_NATIVE_SHA) {
            throw 'Wrong native QA source checked out on Windows'
          }
          & ./audit/tests/defragmentation/security/test_windows_denial_integrity.ps1 -NativeRunner ./native/tests/defragmentation/native-e2e/windows_webview2.ps1

  audit-unittest-discovery:
    name: "Security / native evidence imported by unittest discovery"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Agent 10 review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute actual unittest discovery with full evidence assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_native_visual_adjudication.py' -v 2>&1 | tee /tmp/native-evidence-discovery.log
          grep -Eq '^Ran ([5-9]|[1-9][0-9]+) tests? in ' /tmp/native-evidence-discovery.log || {
            echo "Native evidence adversarial tests were not discovered and executed"
            exit 1
          }
      - name: Also execute explicit-source contract used in the pinned feature gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/defragmentation/security/test_native_visual_adjudication.py tests/defragmentation/native-e2e/linux_webkit.py

  pin-integration:
    name: "Security / pin exact integration source"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve current PR 114 source once for all matrix jobs
        id: pin
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.integration_sha }}
        run: |
          set -euo pipefail
          branch="refs/heads/integration/scriptotar-defragmentation-agent00-20261113"
          current="$(git ls-remote --exit-code https://github.com/MousaXD/scriptotar.git "$branch" | awk '{print $1}')"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot authenticate exact branch source SHA" >&2; exit 1; }
          if [[ -n "${REQUESTED_SHA:-}" && "$REQUESTED_SHA" != "$current" ]]; then
            echo "Requested integration SHA is stale; branch moved. Refuse to certify." >&2
            exit 1
          fi
          echo "Pinning exact integration source: $current"
          echo "sha=$current" >> "$GITHUB_OUTPUT"
  pin-features:
    name: "Security / pin exact feature PR source set"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.pin.outputs.shas }}
    steps:
      - name: Resolve each independent feature PR once
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          repo="https://github.com/MousaXD/scriptotar.git"
          result="{"
          separator=""
          for pr in 131 141 118 119 128 121 117 137; do
            sha="$(git ls-remote --exit-code "$repo" "refs/pull/$pr/head" | awk '{print $1}')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve PR $pr source" >&2; exit 1; }
            printf 'Pinning feature PR #%s to %s\n' "$pr" "$sha"
            result+="${separator}\"$pr\":\"$sha\""
            separator=","
          done
          result+="}"
          echo "shas=$result" >> "$GITHUB_OUTPUT"

  feature-security:
    needs: [pin-integration, pin-features]
    name: "Security / ${{ matrix.gate }} (feature PR #${{ matrix.pr }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Independently certify Agent 07's QA runner cannot mark image-only
          # rejection evidence as PASS before the required human review.
          - { gate: native-evidence, pr: 131 }
          # Minimal P0 release-certification integrity slice owned by Agent 07.
          # Its native denial verifier must be independently tested pre-merge.
          - { gate: native-evidence-slice, pr: 141 }
          - { gate: provider, pr: 118 }
          - { gate: migration, pr: 119 }
          # Verify proposed v12 receipt repair against the entire independent red suite.
          - { gate: receipt-v12, pr: 128 }
          - { gate: writing, pr: 121 }
          - { gate: verification, pr: 117 }
          # Source permission withdrawal: prevent NEW post-revocation links.
          - { gate: revocation, pr: 137 }
          # Integrated v11 checks should execute even while paid egress is disabled.
          # This separate gate never certifies the full production security boundary.
          - { gate: combined-v11, pr: 114 }
          # Full combined gate still fails closed until host authorization/egress is wired.
          - { gate: combined, pr: 114 }
    steps:
      - name: Checkout exact independent audit HEAD, not synthetic PR merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit
          persist-credentials: false
      - name: Assert independent test provenance matches invoking audit commit
        shell: bash
        env:
          EXPECTED_AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C audit rev-parse HEAD)"
          [[ "$EXPECTED_AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing invoking audit SHA" >&2; exit 1; }
          [[ "$actual" == "$EXPECTED_AUDIT_SHA" ]] || { echo "Independent audit source mismatch" >&2; exit 1; }
          echo "Independent tests bound to $actual"
      # Resolve PR #114's current HEAD once in pin-integration. Do NOT use
      # PR #124 base.sha: that field can be stale after Agent 00 integrates.
      # All feature PRs are pinned to immutable hashes before jobs launch.
      # A postcheck rejects changed PR heads so this matrix cannot certify stale source.
      - name: Checkout exact target feature source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ matrix.pr == 114 && needs.pin-integration.outputs.sha || fromJSON(needs.pin-features.outputs.shas)[format('{0}', matrix.pr)] }}
          path: target
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - name: Set up Python for independent verification and native evidence
        if: matrix.gate == 'verification' || matrix.gate == 'native-evidence'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Tauri native build dependencies for writing integration test
        if: matrix.gate == 'writing' || matrix.gate == 'combined' || matrix.gate == 'combined-v11'
        run: bash target/scripts/install_tauri_deps.sh
      - name: Exact-head independent regression execution
        shell: bash
        run: bash audit/tests/defragmentation/security/run_feature_gates.sh "${{ matrix.gate }}" "${{ matrix.pr }}"

  verify-pinned-integration:
    name: "Security / exact SHA remains current after the matrix"
    if: always()
    needs: [pin-integration, pin-features, feature-security, audit-unittest-discovery, audit-windows-denial-integrity]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Reject stale or incomplete certification
        shell: bash
        env:
          PINNED_SHA: ${{ needs.pin-integration.outputs.sha }}
          MATRIX_RESULT: ${{ needs.feature-security.result }}
          DISCOVERY_RESULT: ${{ needs.audit-unittest-discovery.result }}
          WINDOWS_RESULT: ${{ needs.audit-windows-denial-integrity.result }}
          PIN_RESULT: ${{ needs.pin-integration.result }}
          FEATURE_PIN_RESULT: ${{ needs.pin-features.result }}
          FEATURE_SHAS: ${{ needs.pin-features.outputs.shas }}
        run: |
          set -euo pipefail
          [[ "$PIN_RESULT" == success && "$FEATURE_PIN_RESULT" == success && "$MATRIX_RESULT" == success && "$DISCOVERY_RESULT" == success && "$WINDOWS_RESULT" == success ]] ||
            { echo "One or more independent security gates did not pass"; exit 1; }
          [[ "$PINNED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "Missing exact integration SHA"; exit 1; }
          branch="refs/heads/integration/scriptotar-defragmentation-agent00-20261113"
          current="$(git ls-remote --exit-code https://github.com/MousaXD/scriptotar.git "$branch" | awk '{print $1}')"
          [[ "$current" == "$PINNED_SHA" ]] ||
            { echo "Integration moved while independent matrix ran; rerun exact-head audit" >&2; exit 1; }
          repo="https://github.com/MousaXD/scriptotar.git"
          for pr in 131 141 118 119 128 121 117 137; do
            pinned="$(printf '%s' "$FEATURE_SHAS" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$pr")"
            [[ "$pinned" =~ ^[0-9a-f]{40}$ ]] || { echo "Bad pinned feature SHA for PR $pr" >&2; exit 1; }
            current="$(git ls-remote --exit-code "$repo" "refs/pull/$pr/head" | awk '{print $1}')"
            [[ "$current" == "$pinned" ]] || { echo "Feature PR $pr moved while matrix ran; rerun" >&2; exit 1; }
          done
          echo "Exact-head security matrix remains valid on integration $PINNED_SHA and eight immutable feature PR sources"

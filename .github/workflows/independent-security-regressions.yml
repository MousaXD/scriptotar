name: Independent security regressions

on:
  pull_request:
    paths:
      - '.github/workflows/independent-security-regressions.yml'
      - 'tests/defragmentation/security/**'
      - 'docs/defragmentation/handoffs/p0-security-certification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-security:
    name: "Security / ${{ matrix.gate }} (feature PR #${{ matrix.pr }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gate: provider, pr: 118 }
          - { gate: migration, pr: 119 }
          - { gate: writing, pr: 121 }
          - { gate: verification, pr: 117 }
          # Integration branch: strictly fails closed until all feature modules land.
          - { gate: combined, pr: 114 }
    steps:
      - name: Checkout independent security tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: audit
          persist-credentials: false
      - name: Checkout latest feature PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: refs/pull/${{ matrix.pr }}/head
          path: target
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - name: Set up Python for verification
        if: matrix.gate == 'verification'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Tauri native build dependencies for writing integration test
        if: matrix.gate == 'writing' || matrix.gate == 'combined'
        run: bash target/scripts/install_tauri_deps.sh
      - name: Exact-head independent regression execution
        shell: bash
        run: bash audit/tests/defragmentation/security/run_feature_gates.sh "${{ matrix.gate }}" "${{ matrix.pr }}"

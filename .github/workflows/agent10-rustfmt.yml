name: Agent 10 Rustfmt Helper

on:
  push:
    branches:
      - feat/operational-errors-ui
    paths:
      - '.github/workflows/agent10-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/operational-errors-ui
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Simplify completed-migration startup branch
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/lib.rs')
          text = path.read_text()
          old = '''            let preparation = if let Some(status) = completed_status_if_marked(&data_dir) {
                              if status.state == "completed" {
                                  None
                              } else {
                                  None
                              }
                          } else {
                              Some(migration::prepare_startup(&data_dir))
                          };'''
          new = '''            let preparation = if completed_status_if_marked(&data_dir).is_some() {
                              None
                          } else {
                              Some(migration::prepare_startup(&data_dir))
                          };'''
          if old not in text:
              raise SystemExit('expected startup branch was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: apply rustfmt after operational hardening"
            git push origin HEAD:feat/operational-errors-ui
          fi

name: Windows Tauri Installer

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - 'scriptotar.svg'
      - '.github/workflows/windows-tauri.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'apps/desktop-ui/**'
      - 'sidecars/transcription/**'
      - 'scriptotar.svg'
      - '.github/workflows/windows-tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build and smoke-test NSIS setup.exe
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 branch, immutable security-backport head
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sidecars/transcription/requirements-engine.txt
            sidecars/transcription/requirements-bundle.txt
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # Rust 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.2
      - name: Install pinned runtime bundler dependencies
        run: |
          python -m pip install --disable-pip-version-check -r sidecars/transcription/requirements-bundle.txt
          python -m pip check
      - name: Build self-contained transcription runtime
        run: >-
          python sidecars/transcription/build_runtime.py
          --output apps/desktop/src-tauri/resources/transcription-runtime
      - name: Validate built runtime before Tauri packaging
        run: >-
          python sidecars/transcription/validate_runtime.py
          apps/desktop/src-tauri/resources/transcription-runtime
      - name: Generate Windows icons and platform bundle config
        working-directory: apps/desktop
        shell: pwsh
        run: |
          tauri icon ../../scriptotar.svg --output src-tauri/icons
          @'
          {
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "resources": {
                "resources/transcription-runtime/": "transcription-runtime/"
              },
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.ico"
              ],
              "windows": {
                "nsis": {
                  "installMode": "currentUser"
                }
              }
            }
          }
          '@ | Set-Content -Encoding utf8 src-tauri/tauri.windows.conf.json
      - name: Build frontend assets
        working-directory: apps/desktop-ui
        run: |
          npm ci
          npm run build
      - name: Build locked Windows binary
        run: cargo build --release --locked -p scriptotar-desktop
      - name: Bundle NSIS installer
        working-directory: apps/desktop
        run: tauri bundle
      - name: Stage Windows installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -Path . -Recurse -Filter '*-setup.exe' |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Tauri NSIS installer was not found after a successful bundle.'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = "dist/Scriptotar-Next-$version-x64-setup.exe"
          Copy-Item $installer.FullName $output
          Copy-Item apps/desktop/src-tauri/resources/transcription-runtime/RUNTIME-VERSIONS.txt dist/RUNTIME-VERSIONS.txt
          Set-Content -Encoding ascii dist/TAURI_VERSION $version
          $files = @($output, 'dist/RUNTIME-VERSIONS.txt')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Write-Host "Staged $output from $($installer.FullName)"
      - name: Clean-machine install and packaged runtime smoke
        shell: pwsh
        run: |
          $version = Get-Content dist/TAURI_VERSION
          $installer = (Resolve-Path "dist/Scriptotar-Next-$version-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'scriptotar-next-install'
          $dataDir = Join-Path $env:RUNNER_TEMP 'scriptotar-next-data'
          Remove-Item -Recurse -Force $installDir, $dataDir -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $app = Get-ChildItem -Path $installDir -Recurse -Filter 'scriptotar-desktop.exe' | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem -Path $installDir -Recurse -Filter '*.exe' |
              Where-Object { $_.Name -notmatch 'uninstall|scriptotar-transcription|scriptotar-engine|ffmpeg|ffprobe' } |
              Select-Object -First 1
          }
          if (-not $app) {
            throw 'Installed Scriptotar application executable was not found.'
          }

          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $guiInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $guiInfo.FileName = $app.FullName
          $guiInfo.UseShellExecute = $false
          $guiInfo.Environment['SCRIPTOTAR_DATA_DIR'] = $dataDir
          $guiProcess = [System.Diagnostics.Process]::new()
          $guiProcess.StartInfo = $guiInfo
          if (-not $guiProcess.Start()) {
            throw 'Installed Scriptotar GUI process could not be started.'
          }
          try {
            Start-Sleep -Seconds 5
            if ($guiProcess.HasExited) {
              throw "Installed Scriptotar GUI exited during startup with code $($guiProcess.ExitCode)"
            }
          }
          finally {
            if (-not $guiProcess.HasExited) {
              Stop-Process -Id $guiProcess.Id -Force
              $guiProcess.WaitForExit()
            }
            $guiProcess.Dispose()
          }

          Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $probeInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $probeInfo.FileName = $app.FullName
          $probeInfo.UseShellExecute = $false
          $probeInfo.Environment['SCRIPTOTAR_DATA_DIR'] = $dataDir
          $probeInfo.ArgumentList.Add('--scriptotar-installed-backend-smoke')
          $probe = [System.Diagnostics.Process]::new()
          $probe.StartInfo = $probeInfo
          if (-not $probe.Start()) {
            throw 'Installed Scriptotar backend smoke process could not be started.'
          }
          try {
            if (-not $probe.WaitForExit(20000)) {
              throw 'Installed Scriptotar backend smoke timed out.'
            }
            if ($probe.ExitCode -ne 0) {
              throw "Installed Scriptotar backend smoke exited with code $($probe.ExitCode)"
            }
          }
          finally {
            if (-not $probe.HasExited) {
              Stop-Process -Id $probe.Id -Force
              $probe.WaitForExit()
            }
            $probe.Dispose()
          }

          $database = Join-Path $dataDir 'scriptotar.sqlite3'
          if (-not (Test-Path $database)) {
            throw "Installed Scriptotar backend smoke did not initialize SQLite: $database"
          }

          $runtime = Get-ChildItem -Path $installDir -Recurse -Directory -Filter 'transcription-runtime' | Select-Object -First 1
          if (-not $runtime) {
            throw 'Installed transcription-runtime resource directory was not found.'
          }
          python sidecars/transcription/validate_runtime.py $runtime.FullName
          python sidecars/transcription/compliance_finalize.py --validate $runtime.FullName

          $uninstaller = Get-ChildItem -Path $installDir -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) {
            throw 'NSIS uninstaller was not found after installation.'
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with code $($uninstall.ExitCode)"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptotar-windows-tauri
          path: |
            dist/Scriptotar-Next-*-x64-setup.exe
            dist/TAURI_VERSION
            dist/RUNTIME-VERSIONS.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
